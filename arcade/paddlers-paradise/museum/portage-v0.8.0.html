<title>Paddler's Paradise — an Algonquin canoe trip</title>
<!--
  PADDLER'S PARADISE (working name, Evrtek's) v0.2.0 — a top-down pixel-art
  canoe trip through Algonquin Park.

  Deliberately built with CLASSIC scripts, not ES modules, so this file runs
  from a double-click on the hard drive (file://) with no server and no build
  step. Everything on screen is generated in code — sprite maps, procedural
  audio, hand-authored geography — no outside assets of any kind.

  The geography is honest: Canoe Lake north to Joe Lake and on to Burnt Island
  Lake is a real beginner route, the lake names and portage lengths are real
  facts, and the shapes are drawn from knowledge — never traced from the
  published park map (Evrtek's ruling: clean data only).
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0c1a12;
    touch-action: none;                 /* the game owns every gesture */
    overscroll-behavior: none;          /* no rubber-band, no pull-to-refresh */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position: fixed; inset: 0; width: 100%;   /* iOS: a fixed body cannot be
                                                 dragged into a nav gesture */
  }
  #screen {
    position: absolute; inset: 0; margin: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block;
  }
</style>

// --- builder ----------------------------------------------------------------

var SPRITES = {};

function buildSprite(name, rows, ink) {
  var h = rows.length, w = 0, y, x;
  for (y = 0; y < h; y++) w = Math.max(w, rows[y].length);
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  for (y = 0; y < h; y++) {
    for (x = 0; x < rows[y].length; x++) {
      var ch = rows[y][x];
      if (ch === '.' || ch === ' ') continue;
      var key = ink[ch];
      if (!key) continue;
      g.fillStyle = PAL[key];
      g.fillRect(x, y, 1, 1);
    }
  }
  SPRITES[name] = c;
  return c;
}

function buildAllSprites() {
  var name;
  for (name in MAPS) buildSprite(name, MAPS[name], INK);
  // the objective chevron, in gold
  buildSprite('marker', [
    'gg........gg',
    'ggg......ggg',
    '.ggg....ggg.',
    '..ggg..ggg..',
    '...gggggg...',
    '....gggg....',
    '.....gg.....',
    '............',
  ], { g: 'gold' });
}

// ---------------------------------------------------------------------------
// THE CAMP SET — high-fidelity sprites for the campsite scene (v0.3.0).
// The camp is a SCENE SWITCH, not a zoom (Evrtek's ruling): its own stage at
// four texels per world unit, double the overworld's density. These maps are
// drawn at that density — twice the linear detail of the overworld set — and

// --- deterministic PRNG (mulberry32) ---------------------------------------
function rngFrom(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// fixed clock anchors (not worth dials): the day runs 06:00 to 21:00
var TUNE = { dayStartMin: 360, dayEndMin: 1260, energyMax: 100 };

(function buildTune() {
  var gk, vk;
  for (gk in TUNE_SCHEMA) {
    for (vk in TUNE_SCHEMA[gk].vars) TUNE[vk] = TUNE_SCHEMA[gk].vars[vk].value;
  }
})();

// --- the panel + persistence (overrides only) --------------------------------

var OUTFIT = (function () {
  var KEY = 'paddlers.tune.v1';
  var open = false, panel = null, rows = {};

  function factory(k) {
    var gk;
    for (gk in TUNE_SCHEMA) {
      if (k in TUNE_SCHEMA[gk].vars) return TUNE_SCHEMA[gk].vars[k];
    }
    return null;
  }

  function overrides() {
    var out = {}, gk, vk;
    for (gk in TUNE_SCHEMA) {
      for (vk in TUNE_SCHEMA[gk].vars) {
        if (TUNE[vk] !== TUNE_SCHEMA[gk].vars[vk].value) out[vk] = TUNE[vk];
      }
    }
    return out;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(overrides())); } catch (e) {}
  }

  /** Clamp-and-apply an overrides object; returns how many dials took. */
  function applyObj(o) {
    var n = 0, k;
    for (k in o) {
      var m = factory(k);
      if (!m) continue;                       // a dial that no longer exists
      var v = Number(o[k]);
      if (!isFinite(v)) continue;
      TUNE[k] = Math.max(m.min, Math.min(m.max, v));
      n++;
    }
    return n;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return 0;
      return applyObj(JSON.parse(raw));
    } catch (e) {}
    return 0;
  }

  // --- files, three tiers like Digi-Boot's Boot Room: browser autosave is
  // always on; Save to file writes IN PLACE where the browser allows
  // (Chrome/Edge, after you pick the file once) and downloads elsewhere;
  // Copy settings is the phone's way out — paste the line to CLU and the
  // numbers become the game's new factory defaults by commit.
  var fileHandle = null;
  var IN_ARTIFACT = !!window.__ARTIFACT_BUILD;   // stamped by the bundler

  async function saveToFile() {
    var text = JSON.stringify(overrides(), null, 2);
    if (window.showSaveFilePicker) {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: 'paddlers-tuning.json',
            types: [{ description: 'Paddler tuning', accept: { 'application/json': ['.json'] } }],
          });
        }
        var w = await fileHandle.createWritable();
        await w.write(text);
        await w.close();
        setStatus('saved to ' + fileHandle.name + ' — written in place');
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') { setStatus('save cancelled'); return; }
        setStatus('in-place save unavailable — downloading instead');
      }
    }
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'paddlers-tuning.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus('downloaded paddlers-tuning.json');
  }

  async function loadFromFile() {
    async function take(text, name) {
      var n = applyObj(JSON.parse(text));
      refresh(); save(); setStatus('loaded ' + n + ' dial' + (n === 1 ? '' : 's') + (name ? ' from ' + name : ''));
    }
    if (window.showOpenFilePicker) {
      try {
        var picked = await window.showOpenFilePicker({
          types: [{ description: 'Paddler tuning', accept: { 'application/json': ['.json'] } }],
        });
        fileHandle = picked[0];
        await take(await (await fileHandle.getFile()).text(), fileHandle.name);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') { setStatus('load cancelled'); return; }
      }
    }
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = async function () {
      try { await take(await input.files[0].text(), input.files[0].name); }
      catch (e2) { setStatus('that file did not read as tuning'); }
    };
    input.click();
  }

  function ioBox(show, text) {
    var box = panel.querySelector('#of-iobox');
    box.style.display = show ? 'block' : 'none';
    if (show) {
      var ta = panel.querySelector('#of-io');
      ta.value = text || '';
      if (!text) ta.focus();
    }
  }

  function copySettings() {
    var o = overrides();
    if (!Object.keys(o).length) { setStatus('nothing changed — nothing to copy'); return; }
    var text = JSON.stringify(o);
    var done = function () { ioBox(false); setStatus('copied — paste it to CLU to make these the new defaults'); };
    var fail = function () { ioBox(true, text); setStatus('copy the line from the box below'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else fail();
  }

  function pasteSettings() {
    ioBox(true, '');
    setStatus('paste a settings line below, then Apply');
  }

  function applyPasted() {
    var ta = panel.querySelector('#of-io');
    try {
      var n = applyObj(JSON.parse(ta.value));
      refresh(); save(); ioBox(false);
      setStatus('applied ' + n + ' dial' + (n === 1 ? '' : 's'));
    } catch (e) {
      setStatus('that did not read as a settings line');
    }
  }

  function decimalsFor(step) {
    var s = String(step);
    return s.indexOf('.') >= 0 ? s.length - s.indexOf('.') - 1 : 0;
  }

  function css() {
    var st = document.createElement('style');
    st.textContent =
      '#outfitter{position:fixed;top:0;right:0;height:100%;width:min(330px,94vw);' +
      'background:rgba(10,16,12,0.96);color:#f2f2e8;z-index:40;overflow-y:auto;' +
      'font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;' +
      'border-left:1px solid #f2c14b;padding:10px 12px 40px;box-sizing:border-box;' +
      '-webkit-overflow-scrolling:touch;touch-action:pan-y}' +
      '#outfitter h2{font-size:15px;color:#f2c14b;margin:2px 0 0;letter-spacing:1px}' +
      '#outfitter .of-sub{color:#9ab09a;font-size:11px;margin:0 0 8px}' +
      '#outfitter details{border-top:1px solid #24402c;padding:6px 0}' +
      '#outfitter summary{cursor:pointer;color:#f2c14b;font-weight:600;padding:3px 0}' +
      '#outfitter .of-row{margin:7px 0 2px}' +
      '#outfitter .of-lab{display:flex;justify-content:space-between;align-items:baseline}' +
      '#outfitter .of-val{color:#f2c14b;font-variant-numeric:tabular-nums}' +
      '#outfitter input[type=range]{width:100%;accent-color:#f2c14b;height:22px;touch-action:none}' +
      '#outfitter .of-desc{color:#8a9a8a;font-size:11px;margin-top:-2px}' +
      '#outfitter .of-actions{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}' +
      '#outfitter button{background:#1c2f22;color:#f2f2e8;border:1px solid #f2c14b;' +
      'border-radius:3px;padding:5px 10px;font:600 12px system-ui;cursor:pointer}' +
      '#outfitter .of-status{color:#9ab09a;font-size:11px;min-height:14px}' +
      '#of-close{position:absolute;top:8px;right:10px;font-size:14px;padding:3px 9px}' +
      '#of-iobox{margin:6px 0}' +
      '#of-iobox textarea{width:100%;box-sizing:border-box;background:#0c1810;' +
      'color:#f2f2e8;border:1px solid #24402c;border-radius:3px;font:12px monospace;' +
      'padding:4px;margin-bottom:4px}';
    document.head.appendChild(st);
  }

  function build() {
    css();
    panel = document.createElement('div');
    panel.id = 'outfitter';
    var head = document.createElement('div');
    head.innerHTML = '<h2>THE OUTFITTER</h2>' +
      '<div class="of-sub">live tuning — most dials apply immediately</div>' +
      '<div class="of-actions">' +
      (IN_ARTIFACT ? '' :
        '<button id="of-save">Save to file</button>' +
        '<button id="of-load">Load file</button>') +
      '<button id="of-copy">Copy settings</button>' +
      '<button id="of-paste">Paste settings</button>' +
      '<button id="of-reset">Reset all</button></div>' +
      '<div id="of-iobox" style="display:none"><textarea id="of-io" rows="3" ' +
      'spellcheck="false"></textarea><button id="of-apply">Apply</button></div>' +
      '<div class="of-status" id="of-status"></div>' +
      '<button id="of-close">✕</button>';
    panel.appendChild(head);
    var gk;
    for (gk in TUNE_SCHEMA) {
      var group = TUNE_SCHEMA[gk];
      var det = document.createElement('details');
      if (gk === 'clock' || gk === 'travel') det.open = true;
      var sum = document.createElement('summary');
      sum.textContent = group.label;
      det.appendChild(sum);
      var vk;
      for (vk in group.vars) det.appendChild(row(vk, group.vars[vk]));
      panel.appendChild(det);
    }
    document.body.appendChild(panel);
    panel.querySelector('#of-reset').onclick = resetAll;
    if (!IN_ARTIFACT) {
      panel.querySelector('#of-save').onclick = saveToFile;
      panel.querySelector('#of-load').onclick = loadFromFile;
    }
    panel.querySelector('#of-copy').onclick = copySettings;
    panel.querySelector('#of-paste').onclick = pasteSettings;
    panel.querySelector('#of-apply').onclick = applyPasted;
    panel.querySelector('#of-close').onclick = toggle;
    // the panel is UI, not game surface: keep its pointer events to itself
    ['pointerdown', 'pointermove', 'pointerup', 'keydown'].forEach(function (ev) {
      panel.addEventListener(ev, function (e) { e.stopPropagation(); });
    });
    setStatus();
  }

  function row(k, m) {
    var el = document.createElement('div');
    el.className = 'of-row';
    el.title = m.desc;
    var dec = decimalsFor(m.step);
    var lab = document.createElement('div');
    lab.className = 'of-lab';
    var name = document.createElement('span');
    name.textContent = m.label;
    var val = document.createElement('span');
    val.className = 'of-val';
    lab.appendChild(name); lab.appendChild(val);
    var input = document.createElement('input');
    input.type = 'range';
    input.min = m.min; input.max = m.max; input.step = m.step;
    input.value = TUNE[k];
    var show = function () {
      val.textContent = Number(TUNE[k]).toFixed(dec) + (m.unit ? ' ' + m.unit : '') +
        (TUNE[k] !== m.value ? ' •' : '');
    };
    input.addEventListener('input', function () {
      TUNE[k] = Number(input.value);
      show(); save(); setStatus();
    });
    var desc = document.createElement('div');
    desc.className = 'of-desc';
    desc.textContent = m.desc;
    el.appendChild(lab); el.appendChild(input); el.appendChild(desc);
    show();
    rows[k] = { input: input, show: show };
    return el;
  }

  function refresh() {
    var k;
    for (k in rows) { rows[k].input.value = TUNE[k]; rows[k].show(); }
  }

  function resetAll() {
    var gk, vk;
    for (gk in TUNE_SCHEMA) {
      for (vk in TUNE_SCHEMA[gk].vars) TUNE[vk] = TUNE_SCHEMA[gk].vars[vk].value;
    }
    save(); refresh(); setStatus();
  }

  function setStatus(msg) {
    var st = panel && panel.querySelector('#of-status');
    if (!st) return;
    if (msg !== undefined) { st.textContent = msg; return; }
    var n = Object.keys(overrides()).length;
    st.textContent = n ? n + ' dial' + (n === 1 ? '' : 's') + ' off factory (marked •)'
                       : 'everything at factory settings';
  }

  function toggle() {
    if (!panel) build();
    open = !open;
    panel.style.display = open ? 'block' : 'none';
    if (open) {
      var sub = panel.querySelector('.of-sub');
      if (sub && window.AUDIO && AUDIO.state) {
        sub.textContent = 'live tuning — most dials apply immediately · sound: ' + AUDIO.state();
      }
    }
    return open;
  }

  var restored = load();

  return {
    enabled: false,        // hidden for now, per Evrtek — flip to bring it back
    toggle: toggle,
    isOpen: function () { return open; },
    restored: restored,
  };
})();

  dock:      { x: 600, y: 1500, name: 'Canoe Lake Access Point' },
  board:     { x: 585, y: 1512 },                       // the permit board
  canoeStart:{ x: 615, y: 1496 },                       // your canoe, waiting
  cairn:     { x: 782, y: 860, name: 'Tom Thomson cairn',
               text: 'A stone cairn to the painter Tom Thomson, who knew these lakes.' },
};

// Things worth paddling over to. Each has a first-person scene (#9): walk or
// paddle close and LOOK, and the game turns its whole screen into the view.
var INSPECTS = [
  { x: 800, y: 865,  scene: 'cairn',      name: 'Tom Thomson cairn',
    caption: 'The cairn to Tom Thomson, who painted these lakes and drowned in this one, 1917.' },
  { x: 634, y: 1012, scene: 'dam',        name: 'Joe Lake Dam',
    caption: 'The old dam sluices Joe Lake down toward Canoe Lake. The portage goes around, the water goes over.' },
  { x: 312, y: 398,  scene: 'pictograph', name: 'Ochre pictographs', water: true,
    caption: 'Figures in red ochre on wet granite — a canoe, a moose, a sun. Painted long before any portage sign.' },
  { x: 408, y: 505,  scene: 'bigpine',    name: 'The great white pine',
    caption: 'A white pine the loggers never got. Neck bent all the way back, you still cannot see the top move.' },
  { x: 695, y: 30,   scene: 'ranger',     name: 'Ranger cabin ruin',
    caption: 'A ranger cabin gone to moss and peeled logs. The stove has warmed nobody for sixty years.' },
  { x: 585, y: 1258, scene: 'lightning',  name: 'The lightning pine',
    caption: 'Split crown to root one August night. Half of it died; the other half decided not to.' },
];

var CAMPSITES = [
  { id: 'joe',   x: 745, y: 785,  lake: 'Joe Lake',          name: 'Joe Lake island site' },
  { id: 'burnt', x: 520, y: 138,  lake: 'Burnt Island Lake', name: 'Burnt Island — island site' },
  { id: 'canoe', x: 430, y: 1200, lake: 'Canoe Lake',        name: 'Canoe Lake west site' },
  { id: 'ljoe',  x: 500, y: 545,  lake: 'Little Joe Lake',   name: 'Little Joe site' },
];

// --- wildlife ----------------------------------------------------------------
// Anchors + habits. Actual individuals are spawned per trip from the trip
// seed in game.js; these are the places and hours they keep.

var WILDLIFE_SPOTS = [
  { species: 'River Otter',        at: [545, 758],  water: true,  from: 6,  to: 20 },
  { species: 'White-tailed Deer',  at: [386, 1310], water: false, from: 6,  to: 10 },
  { species: 'Bald Eagle',         at: [600, 150],  water: true,  from: 8,  to: 18, flies: true },
  { species: 'Belted Kingfisher',  at: [552, 648],  water: false, from: 7,  to: 19 },
  { species: 'Snapping Turtle',    at: [392, 430],  water: true,  from: 8,  to: 18 },
  { species: 'Common Loon',        at: [600, 1300], water: true,  from: 0,  to: 24 },
  { species: 'Common Loon',        at: [680, 860],  water: true,  from: 0,  to: 24 },
  { species: 'Common Loon',        at: [500, 140],  water: true,  from: 0,  to: 24 },
  { species: 'Moose',              at: [400, 690],  water: false, from: 6,  to: 10 },
  { species: 'Moose',              at: [430, 250],  water: false, from: 17, to: 21 },
  { species: 'Great Blue Heron',   at: [430, 1420], water: false, from: 7,  to: 19 },
  { species: 'Beaver',             at: [630, 1010], water: true,  from: 17, to: 22 },
  { species: 'Painted Turtle',     at: [545, 640],  water: true,  from: 9,  to: 17 },
  { species: 'Painted Turtle',     at: [760, 930],  water: true,  from: 9,  to: 17 },
  { species: 'Red-tailed Hawk',    at: [500, 1120], water: false, from: 9,  to: 18, flies: true },
  { species: 'Red-tailed Hawk',    at: [400, 300],  water: false, from: 10, to: 17, flies: true },
  { species: 'River Otter',        at: [700, 190],  water: true,  from: 7,  to: 19 },
  { species: 'Beaver',             at: [420, 712],  water: true,  from: 16, to: 22 },
];

// beaver lodges (#9): authored roughly, snapped to real shallows in fixup;
// which of them stand this trip is rolled per trip in game.js
var HUT_SPOTS = [
  { x: 630, y: 1008 },
  { x: 415, y: 705 },
  { x: 372, y: 452 },
];

// ---------------------------------------------------------------------------
// Rasterisation
// ---------------------------------------------------------------------------

var GRID = null;           // Uint8Array of terrain codes, gw x gh
var GW = 0, GH = 0;
var TREES = [];            // {x, y, kind} scattered on land, for the renderer
var LILIES = [];           // lily pads on the weedy lakes
var REEDS = [];            // reed clumps along quiet shallows (#11)
var STONES = [];           // just-submerged rocks near shore — hull hazards (#18)
var DEADHEADS = [];        // waterlogged logs, tips breaking the surface (#11)

function smoothPoly(pts, subdiv) {
  // Catmull-Rom through the control points, closed loop
  var out = [], n = pts.length, i, t, p0, p1, p2, p3;
  for (i = 0; i < n; i++) {
    p0 = pts[(i - 1 + n) % n]; p1 = pts[i];
    p2 = pts[(i + 1) % n];     p3 = pts[(i + 2) % n];
    for (t = 0; t < subdiv; t++) {
      var u = t / subdiv, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  return out;
}

function pointInPoly(x, y, poly) {
  var inside = false, i, j, n = poly.length;
  for (i = 0, j = n - 1; i < n; j = i++) {
    var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/**
 * Author roughly, snap precisely. Every authored point of interest is walked
 * to the nearest cell of the terrain it actually needs, spiralling outward —
 * so a campsite authored a few pixels into the lake climbs out onto its own
 * shore instead of drowning the player. This ran the first probe of the world
 * red (every start point was DEEP water) and is the reason it can never
 * happen again: the shapes own the truth, the points follow.
 */
function snapTo(x, y, wants, maxR) {
  if (wants(terrainAt(x, y))) return { x: x, y: y };
  var r, a;
  for (r = 4; r <= (maxR || 120); r += 4) {
    for (a = 0; a < Math.PI * 2; a += Math.PI / 16) {
      var nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
      if (nx < 8 || ny < 8 || nx > WORLD.W - 8 || ny > WORLD.H - 8) continue;
      if (wants(terrainAt(nx, ny))) return { x: nx, y: ny };
    }
  }
  return { x: x, y: y };
}

function wantsLand(t)    { return !isWater(t); }
function wantsShallow(t) { return t === WORLD.SHALLOW; }

function fixupGeography() {
  // the dock stands on the south shore of Canoe Lake, planks reaching north
  var d = snapTo(POIS.dock.x, POIS.dock.y + 30, wantsLand);
  // walk it back toward the water so the planks actually reach it
  var w = snapTo(d.x, d.y, wantsShallow, 60);
  var dx = w.x - d.x, dy = w.y - d.y, len = Math.hypot(dx, dy) || 1;
  POIS.dock.x = Math.round(w.x - (dx / len) * 8);
  POIS.dock.y = Math.round(w.y - (dy / len) * 8);
  var land = snapTo(POIS.dock.x, POIS.dock.y, wantsLand, 60);
  POIS.start = { x: land.x, y: land.y };
  POIS.board.x = land.x - 14; POIS.board.y = land.y + 4;
  var bl = snapTo(POIS.board.x, POIS.board.y, wantsLand, 40);
  POIS.board.x = bl.x; POIS.board.y = bl.y;
  // the canoe waits in the shallows beside the dock
  var cs = snapTo(POIS.dock.x + 10, POIS.dock.y - 4, wantsShallow, 60);
  POIS.canoeStart.x = cs.x; POIS.canoeStart.y = cs.y;

  // campsites climb out of the water onto their own ground
  CAMPSITES.forEach(function (c) {
    var p = snapTo(c.x, c.y, wantsLand);
    // then a step further inland, off the beach
    var p2 = snapTo(p.x, p.y, function (t) { return t === WORLD.GRASS; }, 24);
    c.x = Math.round(p2.x); c.y = Math.round(p2.y);
  });

  var cn = snapTo(POIS.cairn.x + 20, POIS.cairn.y, wantsLand);
  POIS.cairn.x = Math.round(cn.x); POIS.cairn.y = Math.round(cn.y);

  INSPECTS.forEach(function (p) {
    var q = p.water ? snapTo(p.x, p.y, wantsShallow, 60) : snapTo(p.x, p.y, wantsLand, 60);
    p.x = Math.round(q.x); p.y = Math.round(q.y);
  });
  INSPECTS[0].x = POIS.cairn.x; INSPECTS[0].y = POIS.cairn.y;   // one cairn, one truth

  // beaver lodges stand in the shallows, never on a lawn
  HUT_SPOTS.forEach(function (h) {
    var p = snapTo(h.x, h.y, wantsShallow, 80);
    h.x = Math.round(p.x); h.y = Math.round(p.y);
  });
}

function buildWorld() {
  var CELL = WORLD.CELL;
  GW = Math.ceil(WORLD.W / CELL);
  GH = Math.ceil(WORLD.H / CELL);
  GRID = new Uint8Array(GW * GH);
  GRID.fill(WORLD.GRASS);

  var polys = LAKES.map(function (l) { return { lake: l, poly: smoothPoly(l.pts, 6) }; });

  var gx, gy, i;
  for (gy = 0; gy < GH; gy++) {
    for (gx = 0; gx < GW; gx++) {
      var x = gx * CELL + CELL / 2, y = gy * CELL + CELL / 2;
      for (i = 0; i < polys.length; i++) {
        if (pointInPoly(x, y, polys[i].poly)) {
          var isle = false, isl = polys[i].lake.islands, k;
          for (k = 0; k < isl.length; k++) {
            var dx = x - isl[k].c[0], dy = y - isl[k].c[1];
            if (dx * dx + dy * dy < isl[k].r * isl[k].r) { isle = true; break; }
          }
          GRID[gy * GW + gx] = isle ? WORLD.GRASS : WORLD.WATER;
          break;
        }
      }
    }
  }

  // channels: stamp water along the joining lines
  CHANNELS.forEach(function (c) {
    stampLine(c.from, c.to, c.w / 2, WORLD.WATER);
  });

  // shallows + sand: water next to land becomes shallow; land next to water, sand
  var next = new Uint8Array(GRID);
  for (gy = 2; gy < GH - 2; gy++) {
    for (gx = 2; gx < GW - 2; gx++) {
      var t = GRID[gy * GW + gx];
      var nearOther = false, ox, oy;
      for (oy = -2; oy <= 2 && !nearOther; oy++) {
        for (ox = -2; ox <= 2; ox++) {
          var o = GRID[(gy + oy) * GW + (gx + ox)];
          if ((t === WORLD.WATER) !== (o === WORLD.WATER || o === WORLD.SHALLOW)) {
            if ((t === WORLD.WATER && o === WORLD.GRASS) || (t === WORLD.GRASS && (o === WORLD.WATER))) { nearOther = true; break; }
          }
        }
      }
      if (nearOther) next[gy * GW + gx] = (t === WORLD.WATER) ? WORLD.SHALLOW : WORLD.SAND;
    }
  }
  GRID = next;

  // deep water: water far from any shore (a second pass over the result)
  var deep = new Uint8Array(GRID);
  for (gy = 5; gy < GH - 5; gy++) {
    for (gx = 5; gx < GW - 5; gx++) {
      if (GRID[gy * GW + gx] !== WORLD.WATER) continue;
      var allWater = true, ox2, oy2;
      for (oy2 = -5; oy2 <= 5 && allWater; oy2++) {
        for (ox2 = -5; ox2 <= 5; ox2++) {
          var o2 = GRID[(gy + oy2) * GW + (gx + ox2)];
          if (o2 !== WORLD.WATER && o2 !== WORLD.DEEP) { allWater = false; break; }
        }
      }
      if (allWater) deep[gy * GW + gx] = WORLD.DEEP;
    }
  }
  GRID = deep;

  // portage trails carved into the land
  PORTAGES.forEach(function (p) {
    var i2;
    for (i2 = 0; i2 < p.path.length - 1; i2++) {
      stampLine(p.path[i2], p.path[i2 + 1], 5, WORLD.TRAIL, true);
    }
  });

  fixupGeography();          // points snap to the terrain they need
  scatterFlora();            // then the forest keeps clear of the real spots
}

function stampLine(a, b, radius, code, landOnly) {
  var CELL = WORLD.CELL;
  var len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  var steps = Math.ceil(len / (CELL / 2)), s;
  for (s = 0; s <= steps; s++) {
    var x = a[0] + ((b[0] - a[0]) * s) / steps;
    var y = a[1] + ((b[1] - a[1]) * s) / steps;
    var r = Math.ceil(radius / CELL), ox, oy;
    var cgx = Math.floor(x / CELL), cgy = Math.floor(y / CELL);
    for (oy = -r; oy <= r; oy++) {
      for (ox = -r; ox <= r; ox++) {
        if (ox * ox + oy * oy > r * r) continue;
        var gx = cgx + ox, gy = cgy + oy;
        if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) continue;
        var cur = GRID[gy * GW + gx];
        if (landOnly && (cur === WORLD.WATER || cur === WORLD.DEEP || cur === WORLD.SHALLOW)) continue;
        GRID[gy * GW + gx] = code;
      }
    }
  }
}

function terrainAt(x, y) {
  var gx = Math.floor(x / WORLD.CELL), gy = Math.floor(y / WORLD.CELL);
  if (gx < 0 || gy < 0 || gx >= GW || gy >= GH) return WORLD.GRASS;
  return GRID[gy * GW + gx];
}

function isWater(t) { return t === WORLD.WATER || t === WORLD.DEEP || t === WORLD.SHALLOW; }

function scatterFlora() {
  // Terrain is the same every trip, so the forest is too: fixed seed.
  var rnd = rngFrom(0x0A160), i;
  TREES.length = 0;
  for (i = 0; i < 2600; i++) {
    var x = rnd() * WORLD.W, y = rnd() * WORLD.H;
    var t = terrainAt(x, y);
    if (t !== WORLD.GRASS) continue;
    // keep a small clearing around trails, camps and signs
    if (nearAnyTrail(x, y, 10)) continue;
    if (nearAnyCamp(x, y, 16)) continue;
    TREES.push({ x: x, y: y, kind: rnd() < 0.72 ? 'pine' : 'birch' });
  }
  TREES.sort(function (a, b) { return a.y - b.y; });   // painter's order

  LILIES.length = 0;
  var lakes = LAKES.filter(function (l) { return l.lilies; });
  lakes.forEach(function (l) {
    var cx = 0, cy = 0;
    l.pts.forEach(function (p) { cx += p[0]; cy += p[1]; });
    cx /= l.pts.length; cy /= l.pts.length;
    var j;
    for (j = 0; j < 40; j++) {
      var a = rnd() * Math.PI * 2, r = 30 + rnd() * 90;
      var lx = cx + Math.cos(a) * r, ly = cy + Math.sin(a) * r;
      if (isWater(terrainAt(lx, ly))) LILIES.push({ x: lx, y: ly });
    }
  });

  // reeds where the shallows meet sand — the quiet corners of every lake (#11)
  REEDS.length = 0;
  var g2 = 0;
  while (REEDS.length < 240 && g2++ < 20000) {
    var rx = rnd() * WORLD.W, ry = rnd() * WORLD.H;
    if (terrainAt(rx, ry) !== WORLD.SHALLOW) continue;
    if (terrainAt(rx + 5, ry) !== WORLD.SAND && terrainAt(rx - 5, ry) !== WORLD.SAND &&
        terrainAt(rx, ry + 5) !== WORLD.SAND && terrainAt(rx, ry - 5) !== WORLD.SAND) continue;
    REEDS.push({ x: rx, y: ry, n: 3 + Math.floor(rnd() * 3) });
  }

  // shore stones, lying just under the surface (#18): the paddler's tax
  STONES.length = 0;
  var g3 = 0;
  while (STONES.length < 46 && g3++ < 20000) {
    var sx3 = rnd() * WORLD.W, sy3 = rnd() * WORLD.H;
    if (terrainAt(sx3, sy3) !== WORLD.SHALLOW) continue;
    if (nearAnyCamp(sx3, sy3, 30)) continue;         // landings stay kind
    if (nearAnyTrail(sx3, sy3, 20)) continue;        // portage put-ins too
    STONES.push({ x: sx3, y: sy3, r: 1.6 + rnd() * 1.8, hitAt: -99 });
  }

  // deadheads: old logs the loggers lost, tips breaking the surface (#11)
  DEADHEADS.length = 0;
  var g4 = 0;
  while (DEADHEADS.length < 14 && g4++ < 20000) {
    var dx4 = rnd() * WORLD.W, dy4 = rnd() * WORLD.H;
    if (terrainAt(dx4, dy4) !== WORLD.WATER) continue;
    DEADHEADS.push({ x: dx4, y: dy4, a: rnd() * Math.PI * 2 });
  }
}

function nearAnyTrail(x, y, d) {
  var i, j;
  for (i = 0; i < PORTAGES.length; i++) {
    var p = PORTAGES[i].path;
    for (j = 0; j < p.length - 1; j++) {
      if (distToSeg(x, y, p[j], p[j + 1]) < d) return true;
    }
  }
  return false;
}

function nearAnyCamp(x, y, d) {
  var i;
  for (i = 0; i < CAMPSITES.length; i++) {
    var c = CAMPSITES[i];
    if (Math.hypot(x - c.x, y - c.y) < d) return true;
  }
  if (Math.hypot(x - POIS.dock.x, y - POIS.dock.y) < d * 2) return true;
  return false;
}

function distToSeg(px, py, a, b) {
  var dx = b[0] - a[0], dy = b[1] - a[1];
  var t = ((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy || 1);
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a[0] + dx * t), py - (a[1] + dy * t));
}

// --- landings ---------------------------------------------------------------
// The only places a canoe goes ashore: the dock, portage ends, and the water
// edge of each campsite. Keeping landings explicit means nobody ever strands
// a canoe somewhere unreachable.

var LANDINGS = [];

function buildLandings() {
  LANDINGS.length = 0;
  LANDINGS.push({ x: POIS.dock.x, y: POIS.dock.y - 8, kind: 'dock', name: 'Access Point dock' });
  PORTAGES.forEach(function (p, i) {
    var a = p.path[0], b = p.path[p.path.length - 1];
    LANDINGS.push({ x: a[0], y: a[1], kind: 'portage', portage: i, end: 0, name: p.name + ' (' + p.metres + ' m)' });
    LANDINGS.push({ x: b[0], y: b[1], kind: 'portage', portage: i, end: 1, name: p.name + ' (' + p.metres + ' m)' });
  });
  CAMPSITES.forEach(function (c) {
    // campsite landing sits at the nearest water within a short walk
    var best = null, bd = 1e9, a;
    for (a = 0; a < Math.PI * 2; a += Math.PI / 12) {
      var r;
      for (r = 4; r < 40; r += 4) {
        var x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r;
        if (isWater(terrainAt(x, y))) {
          var d = r;
          if (d < bd) { bd = d; best = { x: x, y: y }; }
          break;
        }
      }
    }
    if (best) LANDINGS.push({ x: best.x, y: best.y, kind: 'camp', camp: c.id, name: c.name });
  });
}

/* js/audio.js */
// PORTAGE — AUDIO
// ---------------------------------------------------------------------------
// Everything synthesised in WebAudio — no sample files, same law as the art.
// The soundtrack of Algonquin is mostly silence with a loon in it, so that is
// what this is: loon wails on the water, paddle strokes, fire crackle at
// camp, a mosquito at dusk, and a small chime when something goes right.
// ---------------------------------------------------------------------------

'use strict';

var AUDIO = (function () {
  var ctx = null;
  var muted = false;
  var master = null;
  var buzzOsc = null, buzzGain = null;
  var crackleTimer = 0, loonTimer = 20;
  var kick = null;                 // the silent <audio> loop (see below)
  var pinged = false;              // one soft blip when sound first lives

  /**
   * Mobile audio needs three things a desktop never asks for (Evrtek: total
   * silence on every phone), all of which must happen INSIDE a user gesture:
   *
   * 1. resume() immediately after creating the context — on iOS it can be
   *    born 'suspended' and stay that way forever if nobody asks.
   * 2. A silent warm-up buffer played through the graph — the classic iOS
   *    unlock, still the most reliable way to open the output path.
   * 3. A looping silent <audio> ELEMENT — playing any media element moves
   *    the page's audio session to the 'playback' category, which is what
   *    makes iOS stop muting WebAudio when the RINGER SWITCH is on silent.
   *    Most phones live on silent; without this, everything else is moot.
   */
  function silentWavURI() {
    var n = 4000, sr = 8000;                    // half a second of nothing
    var bytes = new Uint8Array(44 + n * 2);
    var dv = new DataView(bytes.buffer);
    function ws(o, s2) { for (var i = 0; i < s2.length; i++) bytes[o + i] = s2.charCodeAt(i); }
    ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE');
    ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true); dv.setUint32(24, sr, true);
    dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    ws(36, 'data'); dv.setUint32(40, n * 2, true);
    var bin = '', j;
    for (j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
    return 'data:audio/wav;base64,' + btoa(bin);
  }

  function startKick() {
    try {
      if (!kick) {
        kick = document.createElement('audio');
        kick.src = silentWavURI();
        kick.loop = true;
        kick.setAttribute('playsinline', '');
        kick.preload = 'auto';
        // in the DOM for the older iOS builds that insist on it
        (document.body || document.documentElement).appendChild(kick);
      }
      var p = kick.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function ping() {
    if (pinged || muted || !ctx || ctx.state !== 'running') return;
    pinged = true;
    // one soft blip so a phone player KNOWS sound is alive
    tone('sine', 660, 660, 0.09, 0.05);
  }

  function unlock() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ctx.destination);
      try {
        ctx.onstatechange = function () { ping(); };
      } catch (e) {}
    }
    if (ctx.state === 'suspended') {
      var pr = ctx.resume();
      if (pr && pr.then) pr.then(ping, function () {});
    }
    // the warm-up: a real (silent) buffer through the real output, in-gesture
    try {
      var b = ctx.createBuffer(1, 1, 22050);
      var src = ctx.createBufferSource();
      src.buffer = b;
      src.connect(ctx.destination);
      src.start(0);
    } catch (e2) {}
    if (!muted) startKick();
    ping();
  }

  function on() {
    if (!ctx) return false;
    if (ctx.state === 'suspended') {
      // heal quietly: this call cannot play, but the next one may
      var pr2 = ctx.resume();
      if (pr2 && pr2.then) pr2.then(ping, function () {});
      return false;
    }
    return ctx.state === 'running' && !muted;
  }

  function tone(type, f0, f1, dur, vol, delay) {
    if (!on()) return;
    var t = ctx.currentTime + (delay || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, vol, cutoff, delay) {
    if (!on()) return;
    var t = ctx.currentTime + (delay || 0);
    var n = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var d = buf.getChannelData(0), i;
    for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    var g = ctx.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(master);
    src.start(t);
  }

  // The loon: a wail that rises, holds with vibrato, and falls away.
  function loon() {
    if (!on()) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    var vib = ctx.createOscillator(), vibG = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(540, t);
    o.frequency.linearRampToValueAtTime(880, t + 0.45);
    o.frequency.setValueAtTime(880, t + 0.9);
    o.frequency.linearRampToValueAtTime(560, t + 1.5);
    vib.type = 'sine'; vib.frequency.value = 5.5;
    vibG.gain.value = 14;
    vib.connect(vibG).connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.25);
    g.gain.setValueAtTime(0.14, t + 1.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 1.7);
    vib.start(t); vib.stop(t + 1.7);
    // the echo off the far shore
    tone('sine', 700, 560, 0.8, 0.03, 1.9);
  }

  function paddle()   { noise(0.16, 0.20, 900); }
  function clunk()    { tone('sine', 95, 55, 0.14, 0.35); noise(0.07, 0.3, 420); }
  function chop(d)    { noise(0.045, 0.5, 2600, d); tone('triangle', 210, 70, 0.09, 0.2, d); }
  function feed()     { noise(0.2, 0.22, 700); noise(0.06, 0.18, 1600, 0.12); }
  function hail()     { tone('sine', 520, 520, 0.12, 0.06); tone('sine', 660, 660, 0.18, 0.05, 0.16); }
  function chime()    { tone('triangle', 660, 660, 0.12, 0.12); tone('triangle', 990, 990, 0.2, 0.10, 0.10); }
  function tailSlap() { noise(0.10, 0.45, 700); }
  function morning()  { tone('triangle', 523, 523, 0.15, 0.09); tone('triangle', 784, 784, 0.28, 0.08, 0.14); }

  function setBuzz(level) {
    if (!ctx) return;
    if (level > 0 && !buzzOsc && on()) {
      buzzOsc = ctx.createOscillator(); buzzGain = ctx.createGain();
      buzzOsc.type = 'sawtooth'; buzzOsc.frequency.value = 380;
      var wob = ctx.createOscillator(), wobG = ctx.createGain();
      wob.type = 'sine'; wob.frequency.value = 8; wobG.gain.value = 30;
      wob.connect(wobG).connect(buzzOsc.frequency);
      buzzGain.gain.value = 0;
      buzzOsc.connect(buzzGain).connect(master);
      buzzOsc.start(); wob.start();
      buzzOsc._wob = wob;
    }
    if (buzzGain) buzzGain.gain.value = 0.02 * level;
    if (level <= 0 && buzzOsc) {
      buzzOsc.stop(); buzzOsc._wob.stop(); buzzOsc = null; buzzGain = null;
    }
  }

  // ambient pass, called each frame with the situation
  function ambient(dt, state) {
    if (!on()) return;
    // loons keep their own irregular clock, mostly on open water, more at dusk
    loonTimer -= dt * (state.onWater ? 1.6 : 0.5) * (state.dusk ? 2 : 1);
    if (loonTimer <= 0) { loon(); loonTimer = 18 + Math.random() * 30; }
    if (state.campfire) {
      crackleTimer -= dt;
      if (crackleTimer <= 0) { noise(0.05, 0.10, 1400); crackleTimer = 0.12 + Math.random() * 0.5; }
    }
    setBuzz(state.mosquito ? 1 : 0);
  }

  function toggleMute() {
    muted = !muted;
    if (muted) setBuzz(0);
    if (master) master.gain.value = muted ? 0 : 0.5;   // silences sounds in flight
    try {
      if (kick) { if (muted) kick.pause(); else startKick(); }
    } catch (e) {}
    return muted;
  }

  /** For the Outfitter's status line — remote debugging with Evrtek. */
  function state() {
    if (!(window.AudioContext || window.webkitAudioContext)) return 'unsupported';
    if (!ctx) return 'waiting for first tap';
    return ctx.state + (muted ? ', muted' : '') +
      (kick && !kick.paused ? ', session held' : '');
  }

  /** Everything paused (cards, map, title): stop the drone, keep the peace. */
  function hush() { setBuzz(0); }

  return {
    unlock: unlock, ambient: ambient, paddle: paddle, chime: chime,
    loon: loon, tailSlap: tailSlap, morning: morning, hush: hush, clunk: clunk, chop: chop, feed: feed, hail: hail,
    toggleMute: toggleMute, isMuted: function () { return muted; },
    state: state,
  };
})();

</script>
<script>
/* js/scenes.js */
// PADDLER'S PARADISE — SCENES
// ---------------------------------------------------------------------------
// Full-screen, first-person pixel renderings: the moments a trip is actually
// remembered by. Look up at an aurora, watch a meteor shower burn across the
// dark, stand at the Tom Thomson cairn, read an ochre pictograph on wet
// granite. Each scene is one painter function drawing procedurally at the
// framebuffer's 2x resolution — portrait on a phone, landscape on a PC,
// because the painter just fills whatever sky it is given.
//
// Painters receive (g, W, H, t, rnd): a context already under the world
// transform, the viewport in world units, seconds since the scene opened, and
// a PRNG seeded per-instance so no two meteor showers are the same shower.
// ---------------------------------------------------------------------------

'use strict';

var fwMoonCanvas = null, fwMoonR = 0;

function buildFwMoon(r) {
  var c = document.createElement('canvas');
  c.width = r * 2 + 2; c.height = r * 2 + 2;
  var g = c.getContext('2d');
  var x, y;
  for (y = -r; y <= r; y++) {
    for (x = -r; x <= r; x++) {
      var d = Math.sqrt(x * x + y * y) / r;
      if (d > 1) continue;
      var mare = Math.sin(x * 0.9 / (r / 8) + 2) * Math.sin(y * 1.1 / (r / 8) - 1) > 0.55;
      g.fillStyle = mare ? '#c9c4ae' : d > 0.9 ? '#ded9c4' : '#f0ead2';
      g.fillRect(x + r + 1, y + r + 1, 1, 1);
    }
  }
  fwMoonCanvas = c;
  fwMoonR = r;
}

function sceneStars(g, W, H, rnd, n, maxY) {
  var i;
  for (i = 0; i < n; i++) {
    var x = rnd() * W, y = rnd() * (maxY || H);
    var b = rnd();
    g.fillStyle = b > 0.85 ? '#f2f2e8' : b > 0.5 ? '#b8c0d8' : '#6a7290';
    g.fillRect(x, y, 0.5, 0.5);
    if (b > 0.96) { g.fillRect(x - 0.5, y, 0.5, 0.5); g.fillRect(x + 0.5, y, 0.5, 0.5); }
  }
}

function sceneTreeline(g, W, H, rnd, yBase, col) {
  g.fillStyle = col || '#060d08';
  g.fillRect(0, yBase, W, H - yBase);
  var x = 0;
  while (x < W) {
    var tw = 4 + rnd() * 8, th = 6 + rnd() * 16;
    var cx = x + tw / 2, ty = yBase - th;
    var s;
    for (s = 0; s < th; s += 1.5) {
      var half = (tw / 2) * (s / th);
      g.fillRect(cx - half, ty + s, half * 2, 1.6);
    }
    x += tw * 0.7;
  }
}

var SCENE_PAINTERS = {

  // --- the northern lights -------------------------------------------------
  aurora: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#04040f');
    grad.addColorStop(0.7, '#0a1024');
    grad.addColorStop(1, '#101830');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    sceneStars(g, W, H, rnd, 160, H * 0.8);

    // three curtains, breathing at their own speeds
    var c, x;
    for (c = 0; c < 3; c++) {
      var hue = c === 0 ? '105,230,140' : c === 1 ? '80,200,190' : '150,120,220';
      var speed = 0.35 + c * 0.2, drift = c * 2.1;
      for (x = 0; x < W; x += 1) {
        var ph = x * 0.05 + t * speed + drift;
        var top = H * (0.12 + 0.08 * c) + Math.sin(ph) * 6 + Math.sin(ph * 0.37) * 9;
        var len = H * 0.28 + Math.sin(ph * 0.7 + 1.3) * 10;
        var a = 0.10 + 0.08 * Math.abs(Math.sin(ph * 0.53));
        var gr2 = g.createLinearGradient(0, top, 0, top + len);
        gr2.addColorStop(0, 'rgba(' + hue + ',' + (a * 1.6).toFixed(3) + ')');
        gr2.addColorStop(1, 'rgba(' + hue + ',0)');
        g.fillStyle = gr2;
        g.fillRect(x, top, 1, len);
      }
    }
    sceneTreeline(g, W, H, rngFrom(7), H * 0.88);
  },

  // --- a meteor shower ------------------------------------------------------
  meteors: function (g, W, H, t, rnd) {
    g.fillStyle = '#04040f';
    g.fillRect(0, 0, W, H);
    // the Milky Way, as a tilted band of dust
    var i;
    for (i = 0; i < 500; i++) {
      var mx = rnd() * W * 1.4 - W * 0.2;
      var my = mx * 0.35 + H * 0.1 + (rnd() + rnd() - 1) * H * 0.16;
      g.fillStyle = 'rgba(180,190,220,' + (0.05 + rnd() * 0.12).toFixed(3) + ')';
      g.fillRect(mx, my, 0.5, 0.5);
    }
    sceneStars(g, W, H, rnd, 220, H * 0.85);
    // meteors on a fixed schedule from the seed, roughly one a second
    var m;
    for (m = 0; m < 40; m++) {
      var start = m * 0.9 + rnd() * 0.8;
      var age = t - start;
      var x0 = rnd() * W, y0 = rnd() * H * 0.5;
      var ang = 2.2 + rnd() * 0.5;
      var speed = 90 + rnd() * 60;
      if (age < 0 || age > 0.7) continue;
      var hx = x0 + Math.cos(ang) * speed * age;
      var hy = y0 + Math.sin(ang) * speed * age;
      var fade = 1 - age / 0.7;
      var s;
      for (s = 0; s < 12; s++) {
        g.fillStyle = 'rgba(242,242,232,' + (fade * (1 - s / 12)).toFixed(3) + ')';
        g.fillRect(hx - Math.cos(ang) * s * 1.4, hy - Math.sin(ang) * s * 1.4, s < 2 ? 1 : 0.5, s < 2 ? 1 : 0.5);
      }
    }
    sceneTreeline(g, W, H, rngFrom(11), H * 0.9);
  },

  // --- moonrise over the lake ----------------------------------------------
  moonrise: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#070a1c');
    grad.addColorStop(0.62, '#141a3e');
    grad.addColorStop(0.63, '#0e1e33');
    grad.addColorStop(1, '#122a44');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    sceneStars(g, W, H, rnd, 120, H * 0.6);
    var horizon = H * 0.62;
    var mx = W * 0.6, my = horizon - H * 0.16 + Math.max(0, 4 - t) * 3;
    var r = Math.min(W, H) * 0.11;
    // a dithered moon
    var y, x;
    for (y = -r; y <= r; y += 0.5) {
      for (x = -r; x <= r; x += 0.5) {
        var d = Math.sqrt(x * x + y * y) / r;
        if (d > 1) continue;
        var mare = Math.sin(x * 0.8 + 2) * Math.sin(y * 0.9 - 1) > 0.55;
        g.fillStyle = mare ? '#c9c4ae' : d > 0.92 ? '#ded9c4' : '#f0ead2';
        g.fillRect(mx + x, my + y, 0.5, 0.5);
      }
    }
    // the shimmer path on the water
    for (y = horizon + 1; y < H; y += 1) {
      var wob = Math.sin(y * 0.9 + t * 2.2) * (y - horizon) * 0.12;
      var w2 = r * 0.5 + (y - horizon) * 0.18;
      g.fillStyle = 'rgba(240,234,210,' + Math.max(0.02, 0.16 - (y - horizon) / H * 0.14).toFixed(3) + ')';
      g.fillRect(mx - w2 / 2 + wob, y, w2, 0.5);
    }
    sceneTreeline(g, W, H, rngFrom(23), horizon, '#081018');
  },

  // --- the stars from the campsite -----------------------------------------
  starsCamp: function (g, W, H, t, rnd) {
    g.fillStyle = '#04040f';
    g.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < 400; i++) {
      var mx = rnd() * W * 1.3 - W * 0.15;
      var my = mx * -0.4 + H * 0.55 + (rnd() + rnd() - 1) * H * 0.14;
      g.fillStyle = 'rgba(190,196,224,' + (0.04 + rnd() * 0.1).toFixed(3) + ')';
      g.fillRect(mx, my, 0.5, 0.5);
    }
    sceneStars(g, W, H, rnd, 260, H * 0.86);
    // one slow satellite
    var sx2 = (t * 6) % (W + 20) - 10;
    g.fillStyle = '#b8c0d8';
    g.fillRect(sx2, H * 0.2 + sx2 * 0.05, 0.6, 0.6);
    sceneTreeline(g, W, H, rngFrom(31), H * 0.84);
    // firelight breathing at the bottom edge
    var glow = g.createLinearGradient(0, H, 0, H * 0.8);
    glow.addColorStop(0, 'rgba(232,132,42,' + (0.22 + 0.08 * Math.sin(t * 5)).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(232,132,42,0)');
    g.fillStyle = glow;
    g.fillRect(0, H * 0.8, W, H * 0.2);
  },

  // --- the Tom Thomson cairn -----------------------------------------------
  cairn: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8fb6d8');
    grad.addColorStop(0.54, '#c9d8e2');
    grad.addColorStop(0.55, '#1e567a');
    grad.addColorStop(1, '#17435f');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    var horizon = H * 0.5;
    sceneTreeline(g, W, H, rngFrom(41), horizon, '#274d33');
    g.fillStyle = '#1e567a';
    g.fillRect(0, horizon + 6, W, H - horizon - 6);
    var y;
    for (y = horizon + 8; y < H * 0.72; y += 2) {
      g.fillStyle = 'rgba(63,131,168,0.4)';
      g.fillRect((Math.sin(y * 0.7 + t) * 6 + W / 2), y, 10 + (y % 5), 0.5);
    }
    // the point of land, and the cairn upon it
    g.fillStyle = '#2a5c35';
    g.fillRect(0, H * 0.72, W, H - H * 0.72);
    g.fillStyle = '#20492a';
    g.fillRect(0, H * 0.72, W, 1.5);
    var cx = W * 0.5, base = H * 0.88, rows = 8, r2;
    for (r2 = 0; r2 < rows; r2++) {
      var rw = (rows - r2) * 4.6 + 4, ry = base - r2 * 4.2;
      var stones = Math.max(2, Math.round(rw / 6)), s2;
      for (s2 = 0; s2 < stones; s2++) {
        var stx = cx - rw / 2 + (rw / stones) * s2 + rnd() * 1.5;
        g.fillStyle = (s2 + r2) % 2 ? '#8d8d95' : '#6e6e78';
        g.fillRect(stx, ry, rw / stones - 0.8, 4);
        g.fillStyle = 'rgba(240,240,235,0.25)';
        g.fillRect(stx, ry, rw / stones - 0.8, 0.8);
      }
    }
    // the brass plaque
    g.fillStyle = '#a8905e';
    g.fillRect(cx - 5, base - rows * 4.2 + 9, 10, 6);
  },

  // --- the Joe Lake dam ------------------------------------------------------
  dam: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#9fc2dc');
    grad.addColorStop(0.4, '#cfe0e8');
    grad.addColorStop(0.41, '#2b6b8f');
    grad.addColorStop(1, '#17435f');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    sceneTreeline(g, W, H, rngFrom(53), H * 0.4, '#274d33');
    // upper water
    g.fillStyle = '#2b6b8f';
    g.fillRect(0, H * 0.42, W, H * 0.12);
    // the dam: timber and stone across the frame
    var dy = H * 0.54, i;
    g.fillStyle = '#5d4632';
    g.fillRect(0, dy, W, 5);
    g.fillStyle = '#463526';
    for (i = 0; i < W; i += 7) g.fillRect(i, dy, 1, 5);
    g.fillStyle = '#6e6e78';
    g.fillRect(0, dy + 5, W, 3);
    // water sliding over, in animated white threads
    for (i = 0; i < W; i += 3) {
      var ph = (t * 40 + i * 7) % 20;
      g.fillStyle = 'rgba(240,246,250,0.8)';
      g.fillRect(i + Math.sin(i) * 0.5, dy + 5 + ph * 0.9, 1.2, 4);
      g.fillStyle = 'rgba(207,224,232,0.5)';
      g.fillRect(i, dy + 8, 1.6, H * 0.28);
    }
    // churn at the foot
    for (i = 0; i < W; i += 2) {
      g.fillStyle = 'rgba(240,246,250,' + (0.3 + 0.25 * Math.sin(t * 6 + i)).toFixed(3) + ')';
      g.fillRect(i, H * 0.78 + Math.sin(t * 4 + i * 2) * 1.5, 2, 1);
    }
    g.fillStyle = '#17435f';
    g.fillRect(0, H * 0.82, W, H - H * 0.82);
  },

  // --- ochre pictographs on granite -----------------------------------------
  pictograph: function (g, W, H, t, rnd) {
    g.fillStyle = '#8d8d95';
    g.fillRect(0, 0, W, H);
    var i;
    for (i = 0; i < 900; i++) {
      var x = rnd() * W, y = rnd() * H;
      var v = rnd();
      g.fillStyle = v > 0.66 ? '#7c7c86' : v > 0.33 ? '#9a9aa2' : '#6e6e78';
      g.fillRect(x, y, 1 + rnd() * 2, 0.5 + rnd() * 1.5);
    }
    // a wet sheen creeping down the face
    g.fillStyle = 'rgba(60,70,80,0.25)';
    g.fillRect(W * 0.15, 0, W * 0.08, H);
    g.fillRect(W * 0.7, 0, W * 0.05, H);
    // the ochre figures: a canoe with paddlers, a moose, a sun
    var o = '#a33e2f';
    g.fillStyle = o;
    var cx = W * 0.32, cy = H * 0.4;
    g.fillRect(cx - 12, cy, 24, 2);                       // hull
    g.fillRect(cx - 13, cy - 1.5, 2, 2); g.fillRect(cx + 11, cy - 1.5, 2, 2);
    g.fillRect(cx - 5, cy - 5, 1.5, 5); g.fillRect(cx + 3, cy - 5, 1.5, 5);
    var mx2 = W * 0.62, my2 = H * 0.55;                   // the moose
    g.fillRect(mx2, my2, 14, 6);
    g.fillRect(mx2 + 12, my2 - 4, 3, 5);
    g.fillRect(mx2 + 13, my2 - 8, 1, 4); g.fillRect(mx2 + 15.5, my2 - 8, 1, 4);
    g.fillRect(mx2 + 1, my2 + 6, 1.5, 5); g.fillRect(mx2 + 10, my2 + 6, 1.5, 5);
    var sx3 = W * 0.5, sy3 = H * 0.22;                    // the sun
    g.fillRect(sx3 - 3, sy3 - 3, 6, 6);
    for (i = 0; i < 8; i++) {
      var a2 = (i / 8) * Math.PI * 2;
      g.fillRect(sx3 + Math.cos(a2) * 6 - 0.5, sy3 + Math.sin(a2) * 6 - 0.5, 1.5, 1.5);
    }
    // waterline at the foot of the rock
    g.fillStyle = '#1e567a';
    g.fillRect(0, H * 0.88, W, H - H * 0.88);
    for (i = 0; i < W; i += 3) {
      g.fillStyle = 'rgba(63,131,168,0.6)';
      g.fillRect(i, H * 0.88 + Math.sin(t * 2 + i * 0.4) * 0.8, 2, 0.6);
    }
  },

  // --- looking up the big white pine ---------------------------------------
  bigpine: function (g, W, H, t, rnd) {
    g.fillStyle = '#8fb6d8';
    g.fillRect(0, 0, W, H);
    var i, i2;
    // the trunk, converging upward to the vanishing point
    var vx = W * 0.5;
    for (i2 = 0; i2 < H; i2 += 1) {
      var frac = i2 / H;                        // 0 top (far) -> 1 bottom (near)
      var tw = 4 + frac * frac * W * 0.42;
      g.fillStyle = frac > 0.5 ? '#5d4632' : '#463526';
      g.fillRect(vx - tw / 2, i2, tw, 1.2);
      if ((i2 % 6) < 2) {
        g.fillStyle = 'rgba(122,92,66,0.7)';    // bark ridges
        g.fillRect(vx - tw / 2 + 1, i2, tw - 2, 0.6);
      }
    }
    // branch whorls with needle clusters, swaying just barely
    for (i = 0; i < 9; i++) {
      var by = H * 0.06 + i * H * 0.09;
      var frac2 = by / H;
      var reach = W * (0.12 + frac2 * 0.5);
      var sway = Math.sin(t * 0.8 + i) * 1.5;
      var dir = i % 2 ? 1 : -1;
      var bx1 = vx + dir * reach + sway;
      g.fillStyle = '#463526';
      var st;
      for (st = 0; st < 1; st += 0.05) {
        g.fillRect(vx + (bx1 - vx) * st, by + Math.sin(st * 3) * 2 - st * 4, 2, 1);
      }
      var n;
      for (n = 0; n < 26; n++) {
        var nx = bx1 - dir * rnd() * reach * 0.6, ny = by - 4 - rnd() * 7;
        g.fillStyle = n % 3 ? '#2c6e3f' : '#3f8a52';
        g.fillRect(nx, ny + Math.sin(t + n) * 0.4, 2.5, 1.2);
      }
    }
  },

  // --- the ranger cabin ruin (Far Shore trip) --------------------------------
  ranger: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#8fb6d8');
    grad.addColorStop(0.5, '#cfe0e8');
    grad.addColorStop(0.51, '#2a5c35');
    grad.addColorStop(1, '#20492a');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    sceneTreeline(g, W, H, rngFrom(71), H * 0.5, '#274d33');
    // the clearing
    g.fillStyle = '#2a5c35';
    g.fillRect(0, H * 0.52, W, H);
    var i;
    for (i = 0; i < 260; i++) {
      g.fillStyle = rnd() > 0.5 ? '#20492a' : '#3f8a52';
      g.fillRect(rnd() * W, H * 0.52 + rnd() * H * 0.48, 1.6, 0.8);
    }
    // the cabin: log courses, one wall standing, the roof long gone
    var cx0 = W * 0.24, cw = W * 0.42, cy0 = H * 0.34, chh = H * 0.34;
    var r2;
    for (r2 = 0; r2 < 8; r2++) {
      var ly = cy0 + chh - (r2 + 1) * (chh / 8);
      var sag = Math.sin(r2 * 1.7) * 1.2;
      g.fillStyle = r2 % 2 ? '#5d4632' : '#7a5c42';
      g.fillRect(cx0, ly + sag, cw * (1 - r2 * 0.03), chh / 8 - 0.6);
      // log ends
      g.fillStyle = '#463526';
      g.fillRect(cx0 - 1.6, ly + sag, 1.6, chh / 8 - 0.6);
    }
    // the doorway, dark as a held breath
    g.fillStyle = '#0c0f0a';
    g.fillRect(cx0 + cw * 0.16, cy0 + chh * 0.35, cw * 0.16, chh * 0.65);
    // moss creeping up the north side
    for (i = 0; i < 90; i++) {
      g.fillStyle = 'rgba(63,138,82,' + (0.25 + rnd() * 0.3).toFixed(2) + ')';
      g.fillRect(cx0 + rnd() * cw * 0.4, cy0 + chh * 0.4 + rnd() * chh * 0.6, 1.6, 1);
    }
    // the stone chimney, still standing guard
    var chx = cx0 + cw + W * 0.04;
    var st;
    for (st = 0; st < 12; st++) {
      var sy4 = H * 0.68 - st * (H * 0.038);
      g.fillStyle = st % 2 ? '#8d8d95' : '#6e6e78';
      g.fillRect(chx + Math.sin(st * 2.3) * 0.8, sy4, W * 0.05 - st * 0.12, H * 0.036);
    }
    // fireweed in the clearing, nodding just barely
    for (i = 0; i < 14; i++) {
      var fx3 = rnd() * W, fy3 = H * (0.62 + rnd() * 0.3);
      g.fillStyle = '#2c6e3f';
      g.fillRect(fx3, fy3 - 4, 0.7, 4);
      g.fillStyle = '#e8b4c8';
      g.fillRect(fx3 - 0.8 + Math.sin(t + i) * 0.3, fy3 - 5.5, 2.2, 2);
    }
  },

  // --- the lightning pine (Far Shore trip) -----------------------------------
  lightning: function (g, W, H, t, rnd) {
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#9fc2dc');
    grad.addColorStop(0.8, '#dbe6e2');
    grad.addColorStop(1, '#2a5c35');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    var vx = W * 0.5, splitY = H * 0.5;
    var i2, i;
    // shared trunk below the split
    for (i2 = splitY; i2 < H; i2++) {
      var frac = (i2 - splitY) / (H - splitY);
      var tw = 8 + frac * frac * W * 0.3;
      g.fillStyle = frac > 0.4 ? '#5d4632' : '#463526';
      g.fillRect(vx - tw / 2, i2, tw, 1.2);
    }
    // the char scar, spiralling down the living side of the trunk
    for (i2 = splitY; i2 < H; i2 += 2) {
      var frac2 = (i2 - splitY) / (H - splitY);
      var sw = (8 + frac2 * frac2 * W * 0.3) * 0.22;
      g.fillStyle = '#16120e';
      g.fillRect(vx + Math.sin(frac2 * 5) * sw * 1.6 - sw / 2, i2, sw, 2);
    }
    // DEAD half: charred spar, leaning out left, bare
    var d;
    for (d = 0; d < 1; d += 0.02) {
      var dx2 = vx - d * W * 0.22, dy2 = splitY - d * H * 0.42;
      g.fillStyle = d % 0.08 < 0.04 ? '#16120e' : '#2b241c';
      g.fillRect(dx2 - 3 + d * 2, dy2, 6 - d * 4, 3);
    }
    // a few burnt branch stubs
    for (i = 0; i < 4; i++) {
      var bx2 = vx - (0.2 + i * 0.2) * W * 0.2, by2 = splitY - (0.2 + i * 0.2) * H * 0.4;
      g.fillStyle = '#16120e';
      g.fillRect(bx2 - 6, by2, 7, 1.2);
    }
    // LIVING half: leaning right, green boughs swaying just barely
    for (d = 0; d < 1; d += 0.02) {
      var lx2 = vx + d * W * 0.16, ly3 = splitY - d * H * 0.4;
      g.fillStyle = '#5d4632';
      g.fillRect(lx2 - 2 + d, ly3, 5 - d * 3, 3);
    }
    for (i = 0; i < 40; i++) {
      var bp = 0.15 + rnd() * 0.8;
      var nx2 = vx + bp * W * 0.16 + (rnd() - 0.5) * W * 0.14;
      var ny2 = splitY - bp * H * 0.4 + (rnd() - 0.5) * H * 0.08;
      g.fillStyle = i % 3 ? '#2c6e3f' : '#3f8a52';
      g.fillRect(nx2 + Math.sin(t * 0.8 + i) * 0.5, ny2, 3.2, 1.4);
    }
    // ground, and the shed black shards still lying where they fell
    g.fillStyle = '#2a5c35';
    g.fillRect(0, H * 0.94, W, H * 0.06);
    for (i = 0; i < 6; i++) {
      g.fillStyle = '#16120e';
      g.fillRect(W * (0.2 + rnd() * 0.6), H * (0.94 + rnd() * 0.04), 4 + rnd() * 5, 1.2);
    }
  },

  // --- sitting with the fire (#6, #7) ---------------------------------------
  // The one scene that runs on the game clock: sky, sun, moon and stars are
  // read from hourNow() every frame, so a sunset happens WHILE you watch.
  firewatch: function (g, W, H, t, rnd) {
    var h = hourNow();
    var horizon = H * 0.52;

    // the sky keyframes: [hour, top, low, lake, treeline, starAlpha]
    var K = [
      [5.0,  '#0a0f2e', '#25204a', '#0e1830', '#04140a', 0.8],
      [6.0,  '#233a66', '#c47a5a', '#1a2f4a', '#071a0d', 0.35],
      [8.0,  '#6fa8d4', '#cfe0e8', '#2b6b8f', '#12331c', 0],
      [12.0, '#7db6e0', '#dceaf2', '#2e719a', '#163c20', 0],
      [17.0, '#79a9d8', '#f2d8a0', '#2b6488', '#143a1e', 0],
      [18.8, '#5f7fb0', '#f2b076', '#28577c', '#0f2c16', 0],
      [19.7, '#3a4a8c', '#e2954a', '#22496e', '#0a2010', 0.08],
      [20.2, '#2a2f6e', '#d95f3b', '#1c3c5e', '#081808', 0.25],
      [20.7, '#171c48', '#7a3a58', '#132c48', '#061204', 0.55],
      [21.4, '#0a0f2e', '#252a5a', '#0c1c34', '#040d04', 0.85],
      [22.5, '#04061c', '#0a0f2e', '#081426', '#030a03', 1],
    ];
    var i2 = 0, u = 0;
    if (h <= K[0][0]) { i2 = 0; u = 0; }
    else if (h >= K[K.length - 1][0]) { i2 = K.length - 2; u = 1; }
    else {
      for (i2 = 0; i2 < K.length - 2; i2++) {
        if (h >= K[i2][0] && h <= K[i2 + 1][0]) break;
      }
      u = (h - K[i2][0]) / (K[i2 + 1][0] - K[i2][0]);
    }
    // distant wildlife schedule (#4) — consume rnd() a fixed number of
    // times BEFORE anything conditional touches the stream
    var wild = [];
    var we;
    for (we = 0; we < 12; we++) {
      wild.push({
        type: rnd(),
        start: 8 + we * 11 + rnd() * 7,
        lane: rnd(),
        dir: rnd() < 0.5 ? 1 : -1,
      });
    }
    var jumps = [];
    var jj;
    for (jj = 0; jj < 10; jj++) {
      jumps.push({ start: 5 + jj * 13 + rnd() * 9, x: rnd(), lane: rnd() });
    }

    var top = hexLerp(K[i2][1], K[i2 + 1][1], u);
    var low = hexLerp(K[i2][2], K[i2 + 1][2], u);
    var lake = hexLerp(K[i2][3], K[i2 + 1][3], u);
    var tree = hexLerp(K[i2][4], K[i2 + 1][4], u);
    var starA = K[i2][5] + (K[i2 + 1][5] - K[i2][5]) * u;

    var grad = g.createLinearGradient(0, 0, 0, horizon);
    grad.addColorStop(0, top);
    grad.addColorStop(1, low);
    g.fillStyle = grad;
    g.fillRect(0, 0, W, horizon + 2);

    if (starA > 0.02) {
      g.globalAlpha = starA;
      sceneStars(g, W, H, rnd, 220, horizon * 0.96);
      g.globalAlpha = 1;
    }

    // the sun: crosses and sinks; at the right hour you catch it touching
    // the treeline across the lake
    var glowX = null, glowCol = null;
    if (h < 19.95) {
      var sunP = Math.max(0, Math.min(1, (h - 6) / 13.9));
      var sunX = W * (0.26 + sunP * 0.46);
      var sunY = horizon - Math.max(1.5, ((19.9 - h) / 13.9) * H * 0.42);
      var late = h > 18.2;
      var r0 = late ? Math.min(W, H) * 0.055 : Math.min(W, H) * 0.035;
      if (late) {
        var sg = g.createRadialGradient(sunX, sunY, r0 * 0.4, sunX, sunY, r0 * 4);
        sg.addColorStop(0, 'rgba(242,150,60,0.5)');
        sg.addColorStop(1, 'rgba(242,150,60,0)');
        g.fillStyle = sg;
        g.fillRect(sunX - r0 * 4, sunY - r0 * 4, r0 * 8, r0 * 8);
      }
      g.fillStyle = late ? '#f0a850' : '#f7ecd0';
      g.beginPath();
      g.arc(sunX, sunY, r0, 0, Math.PI * 2);
      g.fill();
      glowX = sunX; glowCol = late ? '240,180,110' : '240,236,210';
    }

    // the moon climbs and crosses the evening sky, slowly — a solid thing
    // at integer pixels, drawn once and blitted, so it neither flickers nor
    // lets the stars shine through it (#7)
    if (h >= 19.7 || h < 5) {
      var hm = h < 5 ? h + 24 : h;
      var mp = Math.max(0, Math.min(1, (hm - 19.7) / 4.2));
      var mx = Math.round(W * (0.14 + 0.66 * mp));
      var my = Math.round(horizon - H * (0.1 + 0.27 * Math.sin(mp * Math.PI)));
      var mr = Math.max(3, Math.round(Math.min(W, H) * 0.05));
      if (!fwMoonCanvas || fwMoonR !== mr) buildFwMoon(mr);
      g.globalAlpha = Math.min(1, starA * 2 + 0.35);   // dusk ghost, night rock
      g.drawImage(fwMoonCanvas, mx - mr - 1, my - mr - 1);
      g.globalAlpha = 1;
      if (starA > 0.1) { glowX = mx; glowCol = '240,234,210'; }
    }

    // the far shore, then the lake over its skirt
    sceneTreeline(g, W, H, rngFrom(67), horizon, tree);
    g.fillStyle = lake;
    g.fillRect(0, horizon + 3.5, W, H - horizon - 3.5);

    // shimmer path under whichever light owns the sky
    if (glowX !== null) {
      var yy2;
      for (yy2 = horizon + 4; yy2 < H * 0.82; yy2 += 1) {
        var wob = Math.sin(yy2 * 0.8 + t * 2) * (yy2 - horizon) * 0.1;
        var w2 = 3 + (yy2 - horizon) * 0.3;
        g.fillStyle = 'rgba(' + glowCol + ',' + Math.max(0.02, 0.14 - (yy2 - horizon) / H * 0.2).toFixed(3) + ')';
        g.fillRect(glowX - w2 / 2 + wob, yy2, w2, 0.5);
      }
    }
    // something alive, far off (#4): a loon working the bay, a heron over
    // the far shore, a moose at the waterline — small, dark, unbothered
    drawFwWildlife(g, W, H, horizon, t, wild);
    drawFwFish(g, W, H, horizon, t, jumps);
    drawFwVisitor(g, W, H, horizon, t);

    // lap lines, catching whatever light there is
    var li;
    for (li = 0; li < 24; li++) {
      var lh = (li * 2654435761) >>> 0;
      var lx = lh % W, ly2 = horizon + 5 + (lh >>> 8) % Math.max(4, (H * 0.28) | 0);
      if (Math.sin(t * 1.3 + li) > 0.25) {
        g.fillStyle = 'rgba(235,242,248,0.3)';
        g.fillRect(lx, ly2, 5, 0.6);
      }
    }

    // the caption keeps the scene's own time — sitting long enough to cross
    // an hour should not leave last hour's words on screen
    if (S.scene && performance.now() >= (S.scene.capHold || 0)) {
      var fireAlive = S.campSession && S.campSession.chores.fire;
      var newCap = h >= 20.3 ? (fireAlive ? 'Sparks climb. The stars hold still.'
                                          : 'The stars hold still over a dark shore.')
        : h >= 18.6 ? 'The sun leans on the far treeline. Stay for this.'
        : 'The lake breathes. You match it.';
      if (newCap !== S.scene.caption) {
        S.scene.caption = newCap;
        S.scene.capT = performance.now();
      }
    }

    // the near ground you sit on
    g.fillStyle = '#0c1410';
    g.fillRect(0, H * 0.82, W, H * 0.18);
    var gi;
    for (gi = 0; gi < 40; gi++) {
      var gh2 = (gi * 340573321) >>> 0;
      g.fillStyle = gh2 % 2 ? '#132018' : '#0a100c';
      g.fillRect(gh2 % W, H * 0.82 + (gh2 >>> 6) % ((H * 0.16) | 0), 2, 1);
    }

    // the fire — sized by its FUEL (the tending minigame), embers when it
    // is nearly out, or the cold ring waiting for six fresh logs
    var lit = S.campSession && S.campSession.chores.fire;
    var fuel = S.campSession ? (S.campSession.fireFuel || 0) : 5;
    var ff = 0.45 + Math.min(12, fuel) * 0.11;
    var embers = lit && fuel <= 0.15;
    var fx2 = W * 0.5, fy2 = H * 0.86;
    // the ring
    var si;
    for (si = 0; si < 9; si++) {
      var sa = (si / 9) * Math.PI * 2;
      g.fillStyle = si % 2 ? '#6e6e78' : '#4a4a52';
      g.fillRect(fx2 + Math.cos(sa) * W * 0.06 - 1.2, fy2 + Math.sin(sa) * H * 0.02 + 2 - 0.8, 2.6, 1.8);
    }
    if (embers) {
      // a bed of coals pulsing under ash — the warning made visible
      g.fillStyle = '#3a2c1e';
      g.fillRect(fx2 - 7, fy2 + 1, 14, 2.2);
      var eb;
      for (eb = 0; eb < 7; eb++) {
        var ebh = (eb * 340573321) >>> 0;
        var pulse = 0.25 + 0.2 * Math.sin(t * 2.4 + eb * 1.7);
        g.fillStyle = 'rgba(232,110,40,' + pulse.toFixed(2) + ')';
        g.fillRect(fx2 - 5 + (ebh % 10), fy2 + (ebh >>> 4) % 2, 1.4, 0.9);
      }
    } else if (lit) {
      // logs
      g.fillStyle = '#3a2c1e';
      g.fillRect(fx2 - 7, fy2 + 1, 14, 2.2);
      g.fillRect(fx2 - 5, fy2 - 0.5, 10, 2);
      // three tongues of flame, sized by the fuel, breathing at their own speeds
      var fl;
      for (fl = 0; fl < 3; fl++) {
        var fw = (3 - fl) * 2.6 * (0.7 + ff * 0.3);
        var fh = (H * 0.055) * ff * (1 + fl * 0.5) * (0.85 + 0.15 * Math.sin(t * (5 + fl * 2.3) + fl * 2));
        var lean = Math.sin(t * (2.2 + fl) + fl) * 1.6;
        g.fillStyle = fl === 0 ? '#f2f2e8' : fl === 1 ? '#f2c14b' : '#e8842a';
        g.beginPath();
        g.moveTo(fx2 - fw, fy2 + 1);
        g.quadraticCurveTo(fx2 + lean, fy2 - fh, fx2 + fw, fy2 + 1);
        g.fill();
      }
      // sparks — a bigger fire throws more of them, higher
      var sk, nsk = 4 + Math.round(ff * 7);
      for (sk = 0; sk < nsk; sk++) {
        var skh = (sk * 2654435761) >>> 0;
        var rise = (t * (14 + (skh % 7)) + sk * 11) % (H * 0.22 * (0.7 + ff * 0.3));
        var alpha = Math.max(0, 1 - rise / (H * 0.22));
        g.fillStyle = 'rgba(242,193,75,' + (alpha * 0.8).toFixed(2) + ')';
        g.fillRect(fx2 + Math.sin(rise * 0.3 + sk) * 4, fy2 - rise, 0.7, 0.7);
      }
      // the glow the fire throws on everything
      var fg2 = g.createRadialGradient(fx2, fy2, 2, fx2, fy2, H * 0.3 * (0.6 + 0.4 * ff));
      fg2.addColorStop(0, 'rgba(242,160,60,' + ((0.16 + 0.05 * Math.sin(t * 5)) * (0.6 + 0.4 * ff)).toFixed(3) + ')');
      fg2.addColorStop(1, 'rgba(242,160,60,0)');
      g.fillStyle = fg2;
      g.fillRect(fx2 - H * 0.4, fy2 - H * 0.4, H * 0.8, H * 0.8);
    }
  },
};

/** The far-off lives in the firewatch view (#4). Cycles every ~140s. */
function drawFwWildlife(g, W, H, horizon, t, wild) {
  var i;
  for (i = 0; i < wild.length; i++) {
    var ev = wild[i];
    var kind = ev.type < 0.45 ? 'loon' : ev.type < 0.8 ? 'heron' : 'moose';
    var dur = kind === 'moose' ? 14 : kind === 'heron' ? 9 : 16;
    // wrap per-event: a crossing cut by the cycle simply finishes next cycle
    var age = ((t - ev.start) % 140 + 140) % 140;
    if (age > dur) continue;
    var p = age / dur;
    if (kind === 'loon') {
      // swims across the bay, diving for a stretch in the middle
      if (p > 0.45 && p < 0.58) continue;
      var lx = W * (ev.dir > 0 ? p : 1 - p);
      var ly = horizon + 6 + ev.lane * (H * 0.1);
      g.fillStyle = 'rgba(10,14,18,0.8)';
      g.fillRect(lx - 1.5, ly - 0.8, 3, 1);
      g.fillRect(lx + ev.dir * 1.5, ly - 1.9, 0.8, 1.4);
      g.fillStyle = 'rgba(230,238,244,0.22)';
      g.fillRect(lx - ev.dir * 3.2, ly + 0.4, 2.5, 0.4);
      g.fillRect(lx - ev.dir * 5.6, ly + 0.7, 2, 0.3);
    } else if (kind === 'heron') {
      var hx = W * (ev.dir > 0 ? p : 1 - p);
      var hy = horizon - 6 - ev.lane * (H * 0.12) - Math.sin(p * Math.PI * 3) * 1.5;
      var flap = Math.sin(t * 6 + i) > 0 ? 1.2 : -0.5;
      g.fillStyle = 'rgba(8,12,14,0.75)';
      g.fillRect(hx - 2.4, hy - flap, 2.4, 0.7);
      g.fillRect(hx, hy - flap * 0.5, 2.4, 0.7);
      g.fillRect(hx - 0.4, hy, 1, 0.8);
    } else {
      // a moose at the far waterline, there and then not
      var sx2 = W * (0.1 + ev.lane * 0.8);
      var a2 = Math.min(1, age, dur - age) * 0.6;
      g.fillStyle = 'rgba(6,10,8,' + a2.toFixed(2) + ')';
      g.fillRect(sx2 - 2, horizon - 2.6, 4, 1.8);
      g.fillRect(sx2 + (ev.dir > 0 ? 1.7 : -2.5), horizon - 3.7, 0.9, 1.5);
      g.fillRect(sx2 - 1.6, horizon - 0.9, 0.6, 1.1);
      g.fillRect(sx2 + 1, horizon - 0.9, 0.6, 1.1);
    }
  }
}

/** The passing canoeist (#5): hull, paddler, wake — and a paddle raised
 *  high for three seconds if you waved. */
function drawFwVisitor(g, W, H, horizon, t) {
  var cs = S.campSession;
  if (!cs || !cs.visitor) return;
  var v = cs.visitor;
  var p = v.t / v.dur;
  var vx = W * (v.dir > 0 ? -0.05 + p * 1.1 : 1.05 - p * 1.1);
  var vy = horizon + 8 + v.lane * (H * 0.1);
  var bob = Math.sin(t * 1.8) * 0.4;
  // wake
  g.fillStyle = 'rgba(225,235,242,0.2)';
  g.fillRect(vx - v.dir * 6, vy + 1.6 + bob * 0.4, 4.5, 0.5);
  g.fillRect(vx - v.dir * 10, vy + 2.1, 3.5, 0.4);
  // hull, ends upswept
  g.fillStyle = 'rgba(96,32,26,0.95)';
  g.fillRect(vx - 4.5, vy + bob, 9, 1.4);
  g.fillRect(vx - 5.2, vy - 0.6 + bob, 1.2, 1.2);
  g.fillRect(vx + 4.0, vy - 0.6 + bob, 1.2, 1.2);
  // paddler
  g.fillStyle = 'rgba(20,26,30,0.95)';
  g.fillRect(vx - 0.9, vy - 2.6 + bob, 1.8, 2.8);
  g.fillRect(vx - 0.6, vy - 3.6 + bob, 1.2, 1.2);
  // the paddle: dipping strokes — or held HIGH in reply
  if (v.wavedBack > 0) {
    g.fillRect(vx + v.dir * 1.2, vy - 6.6 + bob, 0.7, 4.4);
    g.fillRect(vx + v.dir * 0.9, vy - 7.6 + bob, 1.4, 1.4);
  } else {
    var stroke = Math.sin(t * 2.6);
    var side = stroke > 0 ? 1 : -1;
    g.fillRect(vx + side * 1.6, vy - 1.6 + bob, 0.7, 3 + Math.abs(stroke) * 1.2);
  }
}

/** Fish jumping out on the lake while you watch the fire (Evrtek). */
function drawFwFish(g, W, H, horizon, t, jumps) {
  var i;
  for (i = 0; i < jumps.length; i++) {
    var ev = jumps[i];
    var age = ((t - ev.start) % 140 + 140) % 140;
    if (age > 2.4) continue;
    var jx = W * (0.08 + 0.84 * ev.x);
    var jy = horizon + 6 + ev.lane * (H * 0.16);
    if (age < 0.7) {
      // the arc: up, a silver flash at the top, and back in
      var p = age / 0.7;
      var hgt = Math.sin(p * Math.PI) * 4.5;
      g.fillStyle = p > 0.35 && p < 0.65 ? 'rgba(180,196,206,0.9)' : 'rgba(14,20,26,0.85)';
      g.fillRect(jx - 0.9 + p * 1.8, jy - hgt, 1.8, 0.9);
    } else {
      // rings widening where it went back in
      var rr = (age - 0.7) * 6;
      var al = Math.max(0, 0.32 - (age - 0.7) * 0.16);
      if (al <= 0) continue;
      g.fillStyle = 'rgba(220,232,240,' + al.toFixed(2) + ')';
      g.fillRect(jx - rr, jy + 0.6, rr * 2, 0.5);
      g.fillRect(jx - rr * 0.55, jy - 0.4, rr * 1.1, 0.5);
    }
    if (age >= 0.62 && age < 0.78) {
      g.fillStyle = 'rgba(235,242,248,0.7)';
      g.fillRect(jx - 1.6, jy - 1, 3.2, 1);
    }
  }
}

// --- plumbing ----------------------------------------------------------------

function openScene(name, caption, sub, live) {
  S.scene = {
    name: name,
    caption: caption,
    capT: performance.now(),      // captions fade; a new one fades back in
    btn: live ? 'STAND UP' : 'LOOK AWAY',
    t0: performance.now(),
    seed: Math.floor(S.rnd() * 0xffffffff) >>> 0,
    live: !!live,                 // a live scene lets the game clock run
  };
  S.mode = 'scene';
}

function closeScene() {
  S.scene = null;
  S.mode = 'play';
}

</script>
<script>
/* js/game.js */
// PORTAGE — GAME STATE
// ---------------------------------------------------------------------------
// The trip: launch at the Canoe Lake access point, paddle north, portage,
// camp before dark, reach Burnt Island Lake, and come home. Energy, food and
// daylight are the whole economy. Nothing here kills you — the worst night in
// Algonquin is a rough one, and so it is in the game.
//
// The vantage is old-school GTA on purpose, and so is the grammar: the canoe
// is the car. You walk, you board, you paddle — and on a portage you carry it
// over your head, which no car ever asked of anyone.
// ---------------------------------------------------------------------------

'use strict';

// TUNE lives in tune.js now (Evrtek's dashboard order): a schema the
// Outfitter panel builds its dials from, flattened to the same TUNE object
// the whole codebase has always read.

var DEV = (location.hash || '').indexOf('dev') >= 0;

// --- the whole game -----------------------------------------------------------

var S = null;               // state; rebuilt for every trip
var LAKE_POLYS = [];        // [{name, poly}] for lakeAt()

function newTrip() {
  var seed = (Date.now() & 0xffffffff) >>> 0;
  var rnd = rngFrom(seed);
  S = {
    mode: 'title',
    seed: seed, rnd: rnd,
    day: 1, clock: TUNE.dayStartMin + 60,   // 07:00 on day 1
    energy: TUNE.energyMax, food: TUNE.meals, snacks: TUNE.snacks,
    player: { x: (POIS.start || POIS.dock).x, y: (POIS.start || POIS.dock).y, ang: -Math.PI / 2, speed: 0, anim: 0 },
    travel: 'foot',
    canoe: { x: POIS.canoeStart.x, y: POIS.canoeStart.y, ang: -Math.PI / 2, beached: true },
    wind: rollWind(rnd, 1),
    objIndex: 0, wpIndex: 0,
    journal: [], seen: {},
    seenPOIs: {},
    log: [],
    stats: { paddle: 0, portage: 0, roughNights: 0, camps: 0, fish: 0,
             cooked: 0, hung: 0, stars: 0, boxUses: 0, bearRaids: 0,
             fireSits: 0, logsFed: 0, tended: 0, fireDied: 0, waves: 0,
             skySeen: {}, sites: {} },
    toasts: [], toastT: 0,
    campfire: null,           // {x, y} while a camp is pitched this evening
    sightT: 0, sightTarget: null,
    animals: [],
    card: null,               // {title, lines[], button} for camp/night/end
    mapOpen: false,
    scene: null,              // full-screen first-person moment, when open
    fish: null,               // the line in the water, when fishing
    fx: [],                   // short-lived splashes and such
    campSession: null,        // the evening's camp, while it is pitched
    hintT: 0,
  };
  // which beaver lodges stand this trip (#9)
  S.huts = HUT_SPOTS.filter(function () { return S.rnd() < 0.65; });
  STONES.forEach(function (st) { st.hitAt = -99; });  // clunks reset per trip
  spawnAnimals();
  planDay();
}

/**
 * Each day gets a plan drawn from the trip seed (#6, #8): maybe a sky event
 * after dusk, and zero-to-two things that happen out on the water — so two
 * playthroughs share a route but never quite share a trip.
 */
function planDay() {
  var r = S.rnd;
  var skyRoll = r();
  S.skyTonight = skyRoll < 0.3 ? 'aurora' : skyRoll < 0.65 ? 'meteors' : 'moonrise';
  S.skyShown = false;
  S.lookUp = false;
  S.events = [];
  var n = r() < 0.55 ? 1 : (r() < 0.35 ? 2 : 0);
  var pool = ['windshift', 'squall', 'bearShore', 'fishJump', 'bugs', 'fishJump', 'windshift'];
  var i;
  for (i = 0; i < n; i++) {
    S.events.push({
      at: 9 * 60 + r() * 9 * 60,          // sometime between 09:00 and 18:00
      type: pool[Math.floor(r() * pool.length)],
      done: false,
    });
  }
  S.squall = null;
  S.bugs = null;
  S.fishHot = 0;
}

function rollWind(rnd, day) {
  // day 1 gentle, later days rougher — a real forecast shape
  var str = Math.min(1, 0.15 + rnd() * 0.35 + (day - 1) * 0.2);
  return { from: rnd() * Math.PI * 2, str: str };
}

// --- trips & objectives ---------------------------------------------------------
// Three trips over the one honest park (#1): similar lengths, different
// things worth seeing. Each is an objective chain; the vista objectives
// complete through S.seenPOIs, so LOOKING is the goal, not just arriving.
// fleetScore lines are the review fleet's own best full playthroughs.

var TRIPS = [
  { id: 'classic', name: 'THE PORTAGE CLASSIC',
    blurb: 'North over the 295 m to Burnt Island and home — the honest loop.',
    facts: '2 nights · the dam & the cairn',
    fleetScore: 1116 },
  { id: 'still', name: 'STILL WATER',
    blurb: 'Lily country: the ochre pictographs and the great white pine.',
    facts: '2 nights · the pictographs & the pine',
    fleetScore: 739 },
  { id: 'farshore', name: 'THE FAR SHORE',
    blurb: 'Big-water crossings: the lightning pine and the ranger ruin.',
    facts: '2 nights · the ruin & the lightning pine',
    fleetScore: 1195 },
];

function tripBest(id) {
  try { return +localStorage.getItem('paddlers.best2.' + id) || 0; } catch (e) { return 0; }
}

function startTrip(i) {
  if (!TRIPS[i]) return;
  S.trip = TRIPS[i];
  buildObjectives();
  S.day = 1;
  S.clock = TUNE.dayStartMin + 60;   // 07:00 sharp — browsing the shelf is free
  S.mode = 'play';
  AUDIO.chime();
  toast(OBJS[0].text);
}

var OBJS = [];

function buildObjectives() {
  var P = function (i, end) {
    var L = LANDINGS.filter(function (l) { return l.kind === 'portage' && l.portage === i && l.end === end; })[0];
    return [L.x, L.y];
  };
  var C = function (id) {
    var c = CAMPSITES.filter(function (c2) { return c2.id === id; })[0];
    return [c.x, c.y];
  };
  var I = function (scene) {
    var p = INSPECTS.filter(function (q) { return q.scene === scene; })[0];
    return [p.x, p.y];
  };
  var launch = { text: 'Walk to your red canoe and launch it',
    wps: [[POIS.canoeStart.x, POIS.canoeStart.y]],
    done: function () { return S.travel === 'canoe'; } };
  var home = { text: 'Head home to the Canoe Lake dock',
    wps: [P(2, 1), P(2, 0), P(1, 1), P(1, 0), P(0, 1), P(0, 0), [POIS.dock.x, POIS.dock.y]],
    done: function () { return S.travel !== 'canoe' && near([POIS.dock.x, POIS.dock.y], 26); } };
  var homeShort = { text: 'Head home to the Canoe Lake dock',
    wps: [P(0, 1), P(0, 0), [POIS.dock.x, POIS.dock.y]],
