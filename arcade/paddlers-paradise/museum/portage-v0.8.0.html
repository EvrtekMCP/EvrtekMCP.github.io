    done: function () { return S.travel !== 'canoe' && near([POIS.dock.x, POIS.dock.y], 26); } };
  var tripId = S.trip ? S.trip.id : 'classic';

  if (tripId === 'still') {
    OBJS = [
      launch,
      { text: 'Paddle north up Canoe Lake to the yellow portage sign',
        wps: [P(0, 0)],
        done: function () { return S.travel !== 'canoe' && near(P(0, 0), 30); } },
      { text: 'Portage 295 m, then paddle on into Little Joe',
        wps: [P(0, 1), [552, 752], [505, 688]],
        done: function () { return S.travel === 'canoe' && lakeAt(S.player.x, S.player.y) === 'Little Joe Lake'; } },
      { text: 'Camp at the Little Joe site before dark',
        wps: [C('ljoe')],
        done: function () { return S.lastCamp === 'ljoe'; } },
      { text: 'Day 2 — find the ochre pictographs on Baby Joe',
        wps: [P(1, 0), P(1, 1), I('pictograph')],
        done: function () { return !!S.seenPOIs.pictograph; } },
      { text: 'Stand under the great white pine',
        wps: [I('bigpine')],
        done: function () { return !!S.seenPOIs.bigpine; } },
      { text: 'Make camp for the night — any orange sign',
        wps: [C('ljoe')],
        done: function () { return S.stats.camps >= 2; } },
      homeShort,
    ];
  } else if (tripId === 'farshore') {
    OBJS = [
      launch,
      { text: 'Cross to Wapomeo Island — the lightning pine',
        wps: [I('lightning')],
        done: function () { return !!S.seenPOIs.lightning; } },
      { text: 'Camp at the Canoe Lake west site before dark',
        wps: [C('canoe')],
        done: function () { return S.lastCamp === 'canoe'; } },
      { text: 'Day 2 — run the portages north to Burnt Island Lake',
        wps: [P(0, 0), P(0, 1), P(1, 0), P(1, 1), P(2, 0), P(2, 1)],
        done: function () { return S.travel === 'canoe' && lakeAt(S.player.x, S.player.y) === 'Burnt Island Lake'; } },
      { text: 'Find the ranger cabin ruin',
        wps: [I('ranger')],
        done: function () { return !!S.seenPOIs.ranger; } },
      { text: 'Camp at the Burnt Island north site',
        wps: [C('burnt')],
        done: function () { return S.lastCamp === 'burnt'; } },
      home,
    ];
  } else {
    OBJS = [
      launch,
      { text: 'Paddle north up Canoe Lake to the yellow portage sign',
        wps: [P(0, 0)],
        done: function () { return S.travel !== 'canoe' && near(P(0, 0), 30); } },
      { text: 'Portage 295 m over the Joe Lake dam, then put in',
        wps: [P(0, 1)],
        done: function () { return S.travel === 'canoe' && lakeAt(S.player.x, S.player.y) === 'Joe Lake'; } },
      { text: 'Camp at the Joe Lake island site before dark',
        wps: [C('joe')],
        done: function () { return S.lastCamp === 'joe'; } },
      { text: 'Day 2 — make for Burnt Island Lake',
        wps: [P(1, 0), P(1, 1), P(2, 0), P(2, 1)],
        done: function () { return S.travel === 'canoe' && lakeAt(S.player.x, S.player.y) === 'Burnt Island Lake'; } },
      { text: 'Camp at the Burnt Island north site',
        wps: [C('burnt')],
        done: function () { return S.lastCamp === 'burnt'; } },
      home,
    ];
  }
}

function currentTarget() {
  var o = OBJS[S.objIndex];
  if (!o) return null;
  return o.wps[Math.min(S.wpIndex, o.wps.length - 1)];
}

function near(pt, d) {
  return Math.hypot(S.player.x - pt[0], S.player.y - pt[1]) < d;
}

function tickObjectives() {
  var o = OBJS[S.objIndex];
  if (!o) return;
  var t = currentTarget();
  if (t && near(t, TUNE.waypointAt) && S.wpIndex < o.wps.length - 1) S.wpIndex++;
  if (o.done()) {
    S.objIndex++; S.wpIndex = 0;
    if (S.objIndex >= OBJS.length) { endTrip(); return; }
    AUDIO.chime();
    toast(OBJS[S.objIndex].text);
  }
}

// --- lakes -----------------------------------------------------------------------

function buildLakePolys() {
  LAKE_POLYS = LAKES.map(function (l) {
    var cx = 0, cy = 0;
    l.pts.forEach(function (p) { cx += p[0]; cy += p[1]; });
    return { name: l.name, poly: smoothPoly(l.pts, 6), big: !!l.big,
             cx: cx / l.pts.length, cy: cy / l.pts.length };
  });
}

function lakeAt(x, y) {
  var i;
  for (i = 0; i < LAKE_POLYS.length; i++) {
    if (pointInPoly(x, y, LAKE_POLYS[i].poly)) return LAKE_POLYS[i].name;
  }
  return null;
}

function onBigOpenWater() {
  if (S.travel !== 'canoe') return false;
  if (terrainAt(S.player.x, S.player.y) !== WORLD.DEEP) return false;
  var l = lakeAt(S.player.x, S.player.y), i;
  for (i = 0; i < LAKE_POLYS.length; i++) {
    if (LAKE_POLYS[i].name === l) return LAKE_POLYS[i].big;
  }
  return false;
}

// --- wildlife ----------------------------------------------------------------------

function pushAnimal(species, x, y, water, from, to, flies) {
  S.animals.push({
    species: species, home: [x, y], water: water,
    from: from, to: to, flies: !!flies,
    x: x, y: y, ang: S.rnd() * Math.PI * 2, state: 'idle', t: S.rnd() * 4, fleeT: 0,
  });
}

/** A random spot whose terrain suits the animal, or null. */
function randomHaunt(wantWater) {
  var tries = 60;
  while (tries--) {
    var x = 20 + S.rnd() * (WORLD.W - 40), y = 20 + S.rnd() * (WORLD.H - 40);
    if (isWater(terrainAt(x, y)) === wantWater) return { x: x, y: y };
  }
  return null;
}

function spawnAnimals() {
  S.animals = [];
  // Every haunt rolls for turnout and settles somewhere new each day — two
  // mornings never share a wildlife map (#10)
  WILDLIFE_SPOTS.forEach(function (w) {
    if (S.rnd() > TUNE.animalChance) return;        // out on other business today
    var hx = w.at[0], hy = w.at[1], tries = 14;
    while (tries--) {
      var jx = w.at[0] + (S.rnd() - 0.5) * TUNE.animalJitter * 2;
      var jy = w.at[1] + (S.rnd() - 0.5) * TUNE.animalJitter * 2;
      if (jx < 12 || jy < 12 || jx > WORLD.W - 12 || jy > WORLD.H - 12) continue;
      if (isWater(terrainAt(jx, jy)) === w.water) { hx = jx; hy = jy; break; }
    }
    pushAnimal(w.species, hx, hy, w.water,
      w.from + (S.rnd() - 0.5) * 2, w.to + (S.rnd() - 0.5) * 2, w.flies);
  });
  // wandering extras: today's surprises, anywhere the terrain suits them
  var i;
  for (i = 0; i < TUNE.roamers; i++) {
    var w2 = WILDLIFE_SPOTS[Math.floor(S.rnd() * WILDLIFE_SPOTS.length)];
    var p = randomHaunt(w2.water);
    if (p) pushAnimal(w2.species, p.x, p.y, w2.water,
      Math.max(6, w2.from - 2), Math.min(22, w2.to + 2), w2.flies);
  }
  // an occupied lodge means beavers working the bay at dusk (#9) — and a
  // beaver's home is WATER, verified, never a spot 8 units up the beach
  (S.huts || []).forEach(function (h) {
    if (S.rnd() >= 0.7) return;
    var bx = h.x, by = h.y, tries = 12;
    while (tries--) {
      var jx = h.x + (S.rnd() - 0.5) * 24, jy = h.y + (S.rnd() - 0.5) * 24;
      if (isWater(terrainAt(jx, jy))) { bx = jx; by = jy; break; }
    }
    if (isWater(terrainAt(bx, by))) pushAnimal('Beaver', bx, by, true, 16, 22);
  });
}

function hourNow() { return S.clock / 60; }

function animalActive(a) {
  var h = hourNow();
  return h >= a.from && h <= a.to && a.state !== 'gone';
}

function tickAnimals(dt) {
  var px = S.player.x, py = S.player.y, pspeed = S.player.speed;
  S.sightTarget = null;
  S.animals.forEach(function (a) {
    if (!animalActive(a)) return;
    a.t -= dt;
    if (a.state === 'idle') {
      if (a.t <= 0) { a.ang = S.rnd() * Math.PI * 2; a.t = 2 + S.rnd() * 4; }
      // small drift, tethered home
      var drift = a.flies ? 14 : a.species === 'Moose' ? 5 : 8;
      a.x += Math.cos(a.ang) * drift * dt;
      a.y += Math.sin(a.ang) * drift * dt;
      var hx = a.home[0] - a.x, hy = a.home[1] - a.y;
      if (Math.hypot(hx, hy) > 46) { a.ang = Math.atan2(hy, hx); }
      // stay in / out of water as its kind demands
      var wet = isWater(terrainAt(a.x, a.y));
      if (!a.flies && a.water !== wet) { a.x = a.home[0]; a.y = a.home[1]; }

      var d = Math.hypot(px - a.x, py - a.y);
      if (d < TUNE.fleeRadius && pspeed > TUNE.calmSpeed) {
        a.state = 'flee'; a.fleeT = 1.2;
        if (a.species === 'Beaver') AUDIO.tailSlap();
      } else if (d < TUNE.sightRadius && pspeed <= TUNE.calmSpeed) {
        S.sightTarget = a;
      }
    } else if (a.state === 'flee') {
      var away = Math.atan2(a.y - py, a.x - px);
      a.x += Math.cos(away) * 40 * dt;
      a.y += Math.sin(away) * 40 * dt;
      a.fleeT -= dt;
      if (a.fleeT <= 0) a.state = 'gone';   // dove, or slipped into the trees
    }
  });

  if (S.sightTarget) {
    S.sightT += dt;
    if (S.sightT >= TUNE.sightSeconds) {
      recordSighting(S.sightTarget);
      S.sightT = 0;
    }
  } else {
    S.sightT = 0;
  }
}

function recordSighting(a) {
  a.state = 'gone';           // it goes about its day; the moment was yours
  var first = !S.seen[a.species];
  S.seen[a.species] = (S.seen[a.species] || 0) + 1;
  S.journal.push({ species: a.species, day: S.day });
  toast(a.species + (first ? ' — sighted!' : ' — another one!') +
    ' (' + S.journal.length + ' in the journal)');
  AUDIO.chime();
  if (a.species === 'Common Loon') AUDIO.loon();
}

// --- movement -------------------------------------------------------------------

function moveSpeed(dirX, dirY) {
  if (S.campSession) {
    // on the camp stage: an easy walking pace, no wind, no bushwhack —
    // slower with the barrel in your arms, feet PLANTED mid-axe-swing
    if (S.campSession.chopT > 0) return 0;
    return (S.energy <= TUNE.exhaustedAt ? TUNE.exhaustedMult : 1) * TUNE.walk * 0.9 *
      (S.campSession.carryingBarrel ? 0.75 : 1);
  }
  var t = terrainAt(S.player.x, S.player.y);
  var sp;
  if (S.travel === 'canoe') {
    sp = t === WORLD.SHALLOW ? TUNE.paddleShallow : TUNE.paddle;
    if (onBigOpenWater() && S.wind.str > 0.05) {
      var fx = Math.cos(S.wind.from), fy = Math.sin(S.wind.from);
      var head = dirX * fx + dirY * fy;               // >0 = into the wind
      if (head > 0) sp -= head * S.wind.str * TUNE.windMaxSlow;
    }
  } else if (S.travel === 'carry') {
    sp = TUNE.carry * (t === WORLD.TRAIL ? 1 : 0.7);
  } else {
    sp = (t === WORLD.TRAIL || t === WORLD.SAND) ? TUNE.walk : TUNE.bushwhack;
  }
  if (S.energy <= TUNE.exhaustedAt) sp *= TUNE.exhaustedMult;
  return Math.max(10, sp);
}

function passable(x, y) {
  if (S.campSession) return campPassable(x, y);   // the stage has its own floor
  var t = terrainAt(x, y);
  if (x < 4 || y < 4 || x > WORLD.W - 4 || y > WORLD.H - 4) return false;
  if (S.travel === 'canoe') return isWater(t);
  return !isWater(t);
}

function tickMove(dt, inX, inY) {
  var mag = Math.hypot(inX, inY);
  if (mag < 0.1) { S.player.speed = 0; return; }
  inX /= mag; inY /= mag;

  var sp = moveSpeed(inX, inY);
  var nx = S.player.x + inX * sp * dt;
  var ny = S.player.y + inY * sp * dt;
  // slide order: full move, each axis, then 45-degree deflections — the last
  // two let a walker skirt ROUND obstacles (a diagonal into the fire ring
  // used to dead-stop against the circle, both axis-slides still inside it)
  var d45a = { x: S.player.x + (inX - inY) * 0.7 * sp * dt, y: S.player.y + (inY + inX) * 0.7 * sp * dt };
  var d45b = { x: S.player.x + (inX + inY) * 0.7 * sp * dt, y: S.player.y + (inY - inX) * 0.7 * sp * dt };
  if (passable(nx, ny)) { S.player.x = nx; S.player.y = ny; }
  else if (passable(nx, S.player.y)) { S.player.x = nx; }
  else if (passable(S.player.x, ny)) { S.player.y = ny; }
  else if (passable(d45a.x, d45a.y)) { S.player.x = d45a.x; S.player.y = d45a.y; }
  else if (passable(d45b.x, d45b.y)) { S.player.x = d45b.x; S.player.y = d45b.y; }
  else { S.player.speed = 0; return; }

  S.player.ang = Math.atan2(inY, inX);
  if (inX > 0.1) S.player.face = 1;
  else if (inX < -0.1) S.player.face = -1;
  S.player.speed = sp;
  S.player.anim += dt * sp * 0.28;

  // the canoe rides with you when aboard or overhead
  if (S.travel !== 'foot' && !S.campSession) {
    S.canoe.x = S.player.x; S.canoe.y = S.player.y; S.canoe.ang = S.player.ang;
  }

  // energy
  var drain = S.campSession ? TUNE.drainWalk * 0.5
    : S.travel === 'canoe' ? TUNE.drainPaddle
    : S.travel === 'carry' ? TUNE.drainCarry
    : (terrainAt(S.player.x, S.player.y) === WORLD.TRAIL ? TUNE.drainWalk : TUNE.drainBush);
  if (S.travel === 'canoe' && onBigOpenWater()) {
    var fx = Math.cos(S.wind.from), fy = Math.sin(S.wind.from);
    if (inX * fx + inY * fy > 0.3) drain *= TUNE.headwindDrain;
  }
  if (S.squall && S.travel === 'canoe') drain *= 1.5;   // rain-lashed water
  var wasAbove = S.energy > TUNE.exhaustedAt;
  S.energy = Math.max(0, S.energy - drain * dt);
  if (wasAbove && S.energy <= TUNE.exhaustedAt) {
    toast('Exhausted — eat a snack, or make camp.');
  }

  // the trip log's odometers
  if (S.travel === 'canoe') S.stats.paddle += sp * dt;
  if (S.travel === 'carry') S.stats.portage += sp * dt;
  // paddle strokes, for the ears
  if (S.travel === 'canoe') {
    S.strokeT = (S.strokeT || 0) - dt;
    if (S.strokeT <= 0) { AUDIO.paddle(); S.strokeT = 0.55; }
  }
}

// --- context action ---------------------------------------------------------------
// One button, whose meaning is always written on it. This is most of the
// "figure out what to do" answer: stand near a thing, the button names it.

function nearestLanding(maxD) {
  var best = null, bd = maxD || TUNE.interact;
  LANDINGS.forEach(function (l) {
    var d = Math.hypot(S.player.x - l.x, S.player.y - l.y);
    if (d < bd) { bd = d; best = l; }
  });
  return best;
}

function nearestInspect() {
  var best = null, bd = 22, i;
  for (i = 0; i < INSPECTS.length; i++) {
    var p = INSPECTS[i];
    if (!!p.water !== (S.travel === 'canoe')) continue;   // shore things afoot, cliff things afloat
    var d = Math.hypot(S.player.x - p.x, S.player.y - p.y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function nearestCampsite(maxD) {
  var best = null, bd = maxD || 24;
  CAMPSITES.forEach(function (c) {
    var d = Math.hypot(S.player.x - c.x, S.player.y - c.y);
    if (d < bd) { bd = d; best = c; }
  });
  return best;
}

function nearCanoe() {
  return S.canoe.beached &&
    Math.hypot(S.player.x - S.canoe.x, S.player.y - S.canoe.y) < TUNE.interact;
}

function waterNearby() {
  // Only ever return a point that was ACTUALLY verified to be water. The
  // first version tested at radius r and returned r+6 unverified — the review
  // fleet found 149 standing positions where that put the canoe on dry land
  // with no way to move and no button to press. Prefer the deeper point when
  // it is also water; fall back to the proven sample.
  var a, r;
  for (r = 6; r <= 22; r += 4) {
    for (a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      var wx = S.player.x + Math.cos(a) * r, wy = S.player.y + Math.sin(a) * r;
      if (isWater(terrainAt(wx, wy))) {
        var dx2 = S.player.x + Math.cos(a) * (r + 6), dy2 = S.player.y + Math.sin(a) * (r + 6);
        if (isWater(terrainAt(dx2, dy2))) return { x: dx2, y: dy2 };
        return { x: wx, y: wy };
      }
    }
  }
  return null;
}

function contextAction() {
  if (S.mode !== 'play' && S.mode !== 'fish' && S.mode !== 'scene') return null;

  if (S.mode === 'scene') return { label: 'LOWER YOUR EYES', act: closeScene };
  if (S.mode === 'fish') {
    return { label: S.fish && S.fish.phase === 'strike' ? 'STRIKE!' : 'REEL IN', act: fishAction };
  }

  // while a camp is pitched, the evening owns the button — the canoe waits
  // until morning, chores by proximity (#2)
  if (S.campSession) {
    var ca = campAction();
    if (ca) return ca;
    return null;
  }

  if (S.travel === 'canoe') {
    var l = nearestLanding(30);
    if (l) return { label: 'LAND HERE', act: function () { landCanoe(l); } };
    // A campsite can be approached from any side — if its shore is close,
    // land right where the bow touches instead of demanding one blessed spot.
    var c0 = nearestCampsite(44);
    if (c0) return { label: 'LAND AT CAMP', act: function () {
      landCanoe({ x: S.player.x, y: S.player.y });
    } };
    var poW = nearestInspect();
    if (poW) return { label: 'LOOK — ' + poW.name.toUpperCase(), act: function () {
      S.seenPOIs[poW.scene] = true;
      S.log.push('Day ' + S.day + ' — paddled in close to the ' + poW.name + '.');
      openScene(poW.scene, poW.caption);
    } };
    // anywhere the bow can nose in, you can go ashore (#19) — the whole
    // shoreline is a landing now; named landings just do it better
    var aa, shoreOK = false;
    for (aa = 0; aa < Math.PI * 2; aa += Math.PI / 8) {
      if (!isWater(terrainAt(S.player.x + Math.cos(aa) * 12, S.player.y + Math.sin(aa) * 12))) {
        shoreOK = true; break;
      }
    }
    if (shoreOK) return { label: 'GO ASHORE', act: function () {
      if (!landCanoe({ x: S.player.x, y: S.player.y })) toast('No footing here — try along the shore.');
    } };
    // open water, nothing else calling: the rod is always in the canoe (#4)
    if (S.player.speed < 8) {
      return { label: 'FISH', act: startFishing };
    }
    return null;
  }

  if (S.travel === 'carry') {
    // At a portage END, put in on the side the trail EXITS toward — nearest
    // water at the Joe dam's south sign is the dam POND, and a canoe put
    // into the pond is a canoe in a puddle (fleet playthrough catch).
    var w = portagePutIn() || waterNearby();
    if (w) return { label: 'PUT IN & PADDLE', act: function () { putIn(w); } };
    return { label: 'SET CANOE DOWN', act: function () {
      S.travel = 'foot'; S.canoe.beached = true;
      S.canoe.x = S.player.x; S.canoe.y = S.player.y;
    } };
  }

  // on foot — inside the orange target ring, MAKE CAMP is the primary
  // action at ANY hour (Evrtek: the zone should mean camp, full stop). The
  // old morning deadlock (MAKE CAMP shadowing LAUNCH forever) is prevented
  // by suppression instead of the clock: after BREAK CAMP or walking out,
  // the site stays quiet until you have left its ring once.
  var cSite = nearestCampsite();
  if (cSite && S.suppressCampId === cSite.id &&
      hourNow() < 16 && S.energy > TUNE.exhaustedAt) {
    cSite = null;                     // you just left this one; the canoe first
  }
  if (cSite) return { label: 'MAKE CAMP', act: function () { makeCamp(cSite); } };
  if (nearCanoe()) {
    // At a portage sign the canoe goes over your head — water is ALWAYS
    // nearby at a landing, so if launching outranked carrying, the portage
    // could never begin (found by the first full playthrough drive).
    var pl = nearestLanding(TUNE.interact + 6);
    if (pl && pl.kind === 'portage') {
      var metres = PORTAGES[pl.portage].metres;
      return { label: 'CARRY CANOE — ' + metres + ' m', act: function () {
        S.travel = 'carry'; S.canoe.beached = false;
      } };
    }
    var w2 = waterNearby();
    if (w2) return { label: 'LAUNCH CANOE', act: function () { putIn(w2); } };
    return { label: 'CARRY CANOE', act: function () { S.travel = 'carry'; S.canoe.beached = false; } };
  }
  var po = nearestInspect();
  if (po) return { label: 'LOOK — ' + po.name.toUpperCase(), act: function () {
    S.seenPOIs[po.scene] = true;
    S.log.push('Day ' + S.day + ' — stood a while at the ' + po.name + '.');
    openScene(po.scene, po.caption);
  } };
  return null;
}

function putIn(w) {
  if (!w || !isWater(terrainAt(w.x, w.y))) return;   // never board onto land
  S.travel = 'canoe';
  S.canoe.beached = false;
  S.player.x = w.x; S.player.y = w.y;
  S.canoe.x = w.x; S.canoe.y = w.y;
  AUDIO.paddle();
}

/** Water on the OUTWARD side of the nearest portage end, if we stand at one. */
function portagePutIn() {
  var best = null, bd = 16, bi = -1, be = 0, i, e;
  for (i = 0; i < PORTAGES.length; i++) {
    var path = PORTAGES[i].path;
    var ends = [path[0], path[path.length - 1]];
    for (e = 0; e < 2; e++) {
      var d = Math.hypot(S.player.x - ends[e][0], S.player.y - ends[e][1]);
      if (d < bd) { bd = d; bi = i; be = e; }
    }
  }
  if (bi < 0) return null;
  var p2 = PORTAGES[bi].path;
  var end = be === 0 ? p2[0] : p2[p2.length - 1];
  var adj = be === 0 ? p2[1] : p2[p2.length - 2];
  var dx = end[0] - adj[0], dy = end[1] - adj[1];
  var len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  var k;
  for (k = 5; k <= 26; k += 3) {
    var wx = end[0] + dx * k, wy = end[1] + dy * k;
    if (isWater(terrainAt(wx, wy))) return { x: wx, y: wy };
  }
  return null;
}

function landCanoe(l) {
  // Find dry ground FIRST; only then commit to being on foot. And beach the
  // canoe at the water NEAREST THE PLAYER'S FEET, not wherever the bow first
  // touched — the fleet proved a landing that walked the player 38+ units
  // one way while the canoe stayed offshore the other, unreachable.
  var a, r;
  for (r = 6; r <= 48; r += 4) {
    for (a = 0; a < Math.PI * 2; a += Math.PI / 8) {
      var x = l.x + Math.cos(a) * r, y = l.y + Math.sin(a) * r;
      if (!isWater(terrainAt(x, y))) {
        S.travel = 'foot';
        S.canoe.beached = true;
        S.player.x = x; S.player.y = y;
        // the canoe follows to the closest water within arm's reach of shore
        var bx = l.x, by = l.y, bd = Math.hypot(x - l.x, y - l.y);
        var a2, r2;
        for (r2 = 4; r2 <= 16; r2 += 4) {
          for (a2 = 0; a2 < Math.PI * 2; a2 += Math.PI / 8) {
            var wx = x + Math.cos(a2) * r2, wy = y + Math.sin(a2) * r2;
            if (isWater(terrainAt(wx, wy))) {
              var d2 = r2;
              if (d2 < bd) { bd = d2; bx = wx; by = wy; }
              break;
            }
          }
          if (bd <= r2) break;
        }
        S.canoe.x = bx; S.canoe.y = by;
        return true;
      }
    }
  }
  return false;              // no shore in reach: stay in the canoe
}

// --- camp & nights -----------------------------------------------------------------

function makeCamp(site) {
  // v0.2.0: camp is an EVENING (camp.js), not a card. Tent, wood, fire,
  // dinner, the barrel, the box, the stars — then you turn in.
  enterCamp(site);
}

function sightingsToday() {
  return S.journal.filter(function (j) { return j.day === S.day; }).length;
}

function sleepLine(lines) {
  if (S.fellAsleep) { lines.unshift('You drifted off watching the sky.'); S.fellAsleep = false; }
  return lines;
}

function roughNight() {
  // If camp is pitched and the tent is up, the dark just sends you to bed —
  // a late turn-in, not a rough night. No tent, and the half-made camp is
  // abandoned to the dark.
  if (S.campSession) {
    if (S.campSession.chores.tent) { finishCampNight(); return; }
    S.roughFed = !!S.campSession.chores.cooked;   // dinner was real; credit it
    S.suppressCampId = S.campSession.site.id;     // the ring stays quiet at dawn
    S.campSession = null;
    S.campfire = null;
    leaveCampWorld();                              // the dark sends you back
  }
  S.stats.roughNights++;
  // No fire, no dinner — and no meal deducted: the review fleet caught the
  // first version silently consuming food the morning ignored, which cost a
  // player their last meal for nothing.
  S.log.push('Day ' + S.day + ' — the dark caught me out. A rough night.');
  var afloat = S.travel === 'canoe';
  S.card = {
    title: 'THE DARK CATCHES YOU',
    lines: sleepLine(afloat ? [
      'You drift into a black bay and doze against the gunwales.',
      'Too dark to cook — dinner stays in the barrel.',
      'Camp earlier tomorrow — look for the orange signs.',
    ] : S.roughFed ? [
      'The half-made camp is abandoned to the dark.',
      'At least dinner was eaten before the light went.',
      'Pitch the tent FIRST tomorrow.',
    ] : [
      'No campsite, no fire, all mosquitoes.',
      'Too dark to cook — dinner stays in the barrel.',
      'Camp earlier tomorrow — look for the orange signs.',
    ]),
    button: 'ENDURE', kind: 'rough', ate: true,
  };
  S.mode = 'card';
}

function nextMorning(rough) {
  S.day++;
  S.clock = TUNE.dayStartMin + 30;      // 06:30, mist on the water
  S.energy = rough ? (S.roughFed ? 58 : 45) : (S.card && S.card.ate === false ? 60 : TUNE.energyMax);
  S.roughFed = false;
  S.fish = null;                        // no session survives a night
  S.lookUp = false;                     // last night's sky is last night's
  S.wind = rollWind(S.rnd, S.day);
  S.campfire = null;
  S.campSession = null;
  spawnAnimals();
  planDay();
  S.card = null;
  S.mode = 'play';
  AUDIO.morning();
  tickObjectives();          // last night's camp may have finished an objective
  toast('Day ' + S.day + ' — ' + (OBJS[S.objIndex] ? OBJS[S.objIndex].text : 'homeward.'));
}

function speciesRosterCount() {
  var set = {}, n = 0;
  WILDLIFE_SPOTS.forEach(function (w) { if (!set[w.species]) { set[w.species] = 1; n++; } });
  if (!set['Black Bear']) n++;               // the shore-event walk-on counts
  return n;
}

/**
 * Everything the trip did earns something (#4). The rows double as the trip's
 * story; the completion lines under them are the naturalist's checklist (#20).
 */
function computeScore() {
  var st = S.stats;
  var rows = [], total = 0;
  var add = function (label, pts) { rows.push([label, pts]); total += pts; };
  add('Trip completed', 400);
  if (S.day <= 3) add('Home in ' + S.day + ' days — swift water', 150);
  else if (S.day > 5) add(S.day + ' days out — the barrel ran thin', (S.day - 5) * -30);
  var km = Math.round(st.paddle / 40) / 10;
  add(km + ' km paddled', Math.min(240, Math.round(km * 12)));   // capped: no grinding laps
  var m = Math.round(st.portage * 5.9);   // matches the posted sign lengths
  add(m + ' m portaged', Math.min(200, Math.round(m / 10)));
  if (st.camps) add(st.camps + (st.camps === 1 ? ' night' : ' nights') + ' under canvas', st.camps * 60);
  if (st.cooked) add(st.cooked + (st.cooked === 1 ? ' dinner' : ' dinners') + ' over the fire', st.cooked * 25);
  if (st.hung) add('Barrel hung, ' + st.hung + (st.hung === 1 ? ' night' : ' nights'), st.hung * 20);
  if (st.stars) add(st.stars + (st.stars === 1 ? ' evening' : ' evenings') + ' watching the sky', st.stars * 20);
  if (st.fireSits) add('Sat with the fire ' + st.fireSits + (st.fireSits === 1 ? ' evening' : ' evenings'), Math.min(40, st.fireSits * 10));
  if (st.tended) add(st.tended + (st.tended === 1 ? ' fire' : ' fires') + ' kept to the last', st.tended * 35);
  if (st.logsFed) add(st.logsFed + ' logs fed to evening fires', Math.min(30, st.logsFed * 3));
  if (st.fireDied) add(st.fireDied + (st.fireDied === 1 ? ' fire' : ' fires') + ' lost to neglect', st.fireDied * -20);
  if (st.waves) add(st.waves + ' neighbourly ' + (st.waves === 1 ? 'wave' : 'waves'), Math.min(30, st.waves * 10));
  if (st.fish) add(st.fish + ' fish to the barrel', st.fish * 40);
  if (S.journal.length) add(S.journal.length + ' wildlife sightings', S.journal.length * 15);
  var sp = Object.keys(S.seen).length;
  if (sp) add(sp + ' species in the journal', sp * 40);
  var pois = Object.keys(S.seenPOIs).length;
  if (pois) add(pois + (pois === 1 ? ' place' : ' places') + ' properly looked at', pois * 35);
  var skies = Object.keys(st.skySeen).length;
  if (skies) add(skies + (skies === 1 ? ' night sky' : ' night skies') + ' witnessed', skies * 45);
  if (st.boxUses) add('Thunder box, ' + st.boxUses + (st.boxUses === 1 ? ' visit' : ' visits'), Math.min(30, st.boxUses * 5));
  if (S.snacks) add(S.snacks + (S.snacks === 1 ? ' snack' : ' snacks') + ' never needed', S.snacks * 10);
  if (st.roughNights) add(st.roughNights + (st.roughNights === 1 ? ' rough night' : ' rough nights'), st.roughNights * -40);
  if (st.bearRaids) add(st.bearRaids + (st.bearRaids === 1 ? ' bear raid' : ' bear raids'), st.bearRaids * -35);
  return { rows: rows, total: total };
}

function completionLines() {
  return [
    'Species seen: ' + Object.keys(S.seen).length + ' of ' + speciesRosterCount(),
    'Vistas looked at: ' + Object.keys(S.seenPOIs).length + ' of ' + INSPECTS.length,
    'Night skies: ' + Object.keys(S.stats.skySeen).length + ' of 3 kinds',
    'Campsites slept: ' + Object.keys(S.stats.sites).length + ' of ' + CAMPSITES.length,
  ];
}

function endTrip() {
  S.log.push('Day ' + S.day + ' — took out at the Canoe Lake dock. Trip complete.');
  var sc = computeScore();
  try {
    var k = 'paddlers.best2.' + (S.trip ? S.trip.id : 'classic');
    if (sc.total > (+localStorage.getItem(k) || 0)) localStorage.setItem(k, String(sc.total));
  } catch (e) {}
  S.card = {
    title: 'TRIP COMPLETE',
    score: sc,
    comp: completionLines(),
    lines: [],
    button: 'CHOOSE THE NEXT TRIP', kind: 'end',
  };
  S.mode = 'card';
}

// --- fishing (#4) -----------------------------------------------------------
// Stop the canoe, put a line in. Waiting costs daylight — that is the price —
// and the strike is a moment: miss it and dinner swims off.

function fishSpeciesHere() {
  var l = lakeAt(S.player.x, S.player.y);
  if (l === 'Burnt Island Lake') return 'Lake Trout';
  if (l === 'Little Joe Lake' || l === 'Baby Joe Lake') return 'Yellow Perch';
  return 'Smallmouth Bass';
}

function fishHourMult() {
  var h = hourNow();
  if ((h >= 5.5 && h <= 8.5) || (h >= 17 && h <= 20.5)) return TUNE.fishPrimeMult;
  if (h >= 11 && h <= 15) return TUNE.fishSlowMult;
  return 1;
}

function startFishing() {
  var hot = S.fishHot > S.clock;
  var hm = fishHourMult();
  S.fish = {
    phase: 'wait',
    t: 0,
    biteIn: (TUNE.fishBiteBase + S.rnd() * TUNE.fishBiteSpread) * (hot ? TUNE.fishHotMult : 1) * hm,
    window: TUNE.fishWindow,
  };
  S.mode = 'fish';
  toast(hot ? 'Line in. The water is boiling with them.'
    : hm < 1 ? 'Line in. The light is right — they should be feeding.'
    : hm > 1 ? 'Line in. Midday water — the fish are sulking somewhere cool.'
    : 'Line in. Now the waiting.');
}

function tickFish(dt) {
  // daylight keeps spending while you wait — fishing is never free
  var minPerSec = (TUNE.dayEndMin - TUNE.dayStartMin) / TUNE.daySeconds;
  S.clock += minPerSec * dt;
  var f = S.fish;
  f.t += dt;
  if (f.phase === 'wait' && f.t >= f.biteIn) {
    f.phase = 'strike';
    f.t = 0;
    S.fx.push({ sprite: 'splash', x: S.player.x + Math.cos(S.player.ang) * 10,
      y: S.player.y + Math.sin(S.player.ang) * 10, ttl: 0.8 });
    AUDIO.tailSlap();
  } else if (f.phase === 'strike' && f.t > f.window) {
    S.fish = null; S.mode = 'play';
    toast('It got away.');
  }
  if (S.clock >= TUNE.roughMin) { S.fish = null; S.mode = 'play'; roughNight(); }
}

function fishAction() {
  var f = S.fish;
  if (!f) return;
  if (f.phase === 'strike') {
    var sp = fishSpeciesHere();
    S.food = Math.min(9, S.food + 1);
    S.stats.fish++;
    toast(sp + '! +1 meal in the barrel.');
    AUDIO.chime();
  } else {
    toast('Reeled in. Nothing doing.');
  }
  S.fish = null;
  S.mode = 'play';
}

// --- the day's events (#8) ---------------------------------------------------

function nearestShorePoint(x, y) {
  var a, r;
  for (r = 6; r <= 120; r += 6) {
    for (a = 0; a < Math.PI * 2; a += Math.PI / 12) {
      var nx = x + Math.cos(a) * r, ny = y + Math.sin(a) * r;
      if (!isWater(terrainAt(nx, ny))) return { x: nx, y: ny };
    }
  }
  return null;
}

function fireEvent(type) {
  if (type === 'windshift') {
    S.wind = { from: S.rnd() * Math.PI * 2, str: Math.min(1, 0.2 + S.rnd() * 0.6) };
    toast('The wind swings around.');
  } else if (type === 'squall') {
    if (!S.squall) S.windBefore = S.wind;   // never save a squall as "before"
    S.squall = { until: S.clock + 35 + S.rnd() * 25 };
    S.wind = { from: S.rnd() * Math.PI * 2, str: 0.95 };
    toast('A squall line rolls in — rain and hard wind!');
  } else if (type === 'bearShore') {
    var p = nearestShorePoint(S.player.x, S.player.y);
    if (p) {
      S.animals.push({ species: 'Black Bear', home: [p.x, p.y], water: false,
        from: 0, to: 24, x: p.x, y: p.y, ang: S.rnd() * Math.PI * 2,
        state: 'idle', t: 2, fleeT: 0 });
      toast('Something big is moving on the shore…');
    }
  } else if (type === 'fishJump') {
    S.fx.push({ sprite: 'splash', x: S.player.x + 14, y: S.player.y - 8, ttl: 1.2 });
    S.fishHot = S.clock + 90;
    AUDIO.tailSlap();
    toast('A fish jumps, close. Good water here.');
  } else if (type === 'bugs') {
    S.bugs = { until: S.clock + 25 };
    toast('Blackflies found you — outrun them!');
  }
}

function tickEvents(dt) {
  S.events.forEach(function (e) {
    if (!e.done && S.clock >= e.at) { e.done = true; fireEvent(e.type); }
  });
  if (S.squall && S.clock >= S.squall.until) {
    S.squall = null;
    if (S.windBefore) S.wind = S.windBefore;
    toast('The squall blows through. Quiet again.');
  }
  if (S.bugs) {
    if (S.clock >= S.bugs.until) { S.bugs = null; toast('You outlasted the blackflies.'); }
    else if (S.player.speed < 45) S.energy = Math.max(0, S.energy - 1.1 * dt);
  }
  // tonight's sky, offered once the light is truly gone (#6)
  var h = hourNow();
  if (!S.skyShown && h >= 20.2 && h <= 21.4 && !S.lookUp) {
    S.lookUp = true;
    toast('The sky is doing something. LOOK UP.');
  }
}

function lookUpNow() {
  // Only from open play: fired during a card it orphaned the card (the fleet
  // walked a double-breakfast and a permanently stranded TRIP COMPLETE);
  // fired during fishing it left a phantom bobber following the player.
  if (S.mode !== 'play' || S.mapOpen || OUTFIT.isOpen()) return;
  if (!S.lookUp || S.skyShown) return;
  S.skyShown = true; S.lookUp = false;
  S.stats.skySeen[S.skyTonight] = true;
  var caps = {
    aurora: 'The aurora, green and silent, the whole width of the north.',
    meteors: 'The Perseids. Count them until you lose count.',
    moonrise: 'The moon comes up the colour of birch bark.',
  };
  S.log.push('Day ' + S.day + ' — ' + (S.skyTonight === 'aurora' ? 'the northern lights.' :
    S.skyTonight === 'meteors' ? 'a meteor shower.' : 'watched the moon rise.'));
  openScene(S.skyTonight, caps[S.skyTonight]);
}

function tickStones() {
  if (S.travel !== 'canoe' || S.player.speed < 6) return;
  var i;
  for (i = 0; i < STONES.length; i++) {
    var st = STONES[i];
    var dx = S.player.x - st.x; if (dx > 60 || dx < -60) continue;
    var dy = S.player.y - st.y; if (dy > 60 || dy < -60) continue;
    var reach = st.r + 2.4;
    if (dx * dx + dy * dy < reach * reach) {
      var stamp = S.day * 1440 + S.clock;             // monotonic across days
      if (stamp >= st.hitAt && stamp - st.hitAt < 8) return;   // one clunk per pass
      st.hitAt = stamp;
      AUDIO.clunk();
      S.energy = Math.max(0, S.energy - TUNE.stoneEnergy);
      toast('CLUNK — a rock just under the surface. Watch the shallows.');
      // the hull glances off
      var d = Math.hypot(dx, dy) || 1;
      var nx = S.player.x + (dx / d) * 3, ny = S.player.y + (dy / d) * 3;
      if (passable(nx, ny)) { S.player.x = nx; S.player.y = ny; S.canoe.x = nx; S.canoe.y = ny; }
      return;
    }
  }
}

function tickFx(dt) {
  S.fx.forEach(function (f) { f.ttl -= dt; });
  S.fx = S.fx.filter(function (f) { return f.ttl > 0; });
}

// --- toasts -----------------------------------------------------------------------

function toast(text) {
  // one visible notification, one pending behind it: paired messages rotate
  // through the bar instead of the first dying unrendered (fleet catch)
  S.toasts.push({ text: text, ttl: 3.4 });
  if (S.toasts.length > 2) S.toasts.splice(1, 1);   // newest pending wins
}

// --- per-frame --------------------------------------------------------------------

function tickGame(dt, input) {
  if (OUTFIT.isOpen()) return;      // the Outfitter is a rest stop, everywhere
  if (S.mode === 'scene') {
    if (S.scene && S.scene.live) {
      var mps = (TUNE.dayEndMin - TUNE.dayStartMin) / TUNE.daySeconds;
      S.clock += mps * dt * TUNE.sceneTime;   // savour the first-person hours (#3)
      if (S.campSession && S.scene.name === 'firewatch') {
        tickFireTending(mps * dt * TUNE.sceneTime);
        tickVisitor(dt);
      }
      // sit long enough and the stars COME OUT — that is the watching
      if (S.campSession && S.scene.name === 'firewatch' &&
          !S.campSession.chores.stars && S.clock >= 19.6 * 60) {
        S.campSession.chores.stars = true;
        S.log.push('Day ' + S.day + ' — watched the stars come out over the lake.');
      }
      if (S.clock >= TUNE.roughMin && !S.eyesT) {
        S.eyesT = performance.now();          // you drifted off watching (#8)
      }
      if (S.eyesT && performance.now() - S.eyesT > 1700) {
        S.eyesT = 0;
        S.fellAsleep = true;
        closeScene(); roughNight(); return;
      }
      AUDIO.ambient(dt, {
        onWater: false, dusk: S.clock >= TUNE.duskMin,
        campfire: !!(S.campSession && S.campSession.chores.fire), mosquito: false,
      });
    }
    return;
  }
  if (S.mode === 'title' || S.mode === 'card' || S.mode === 'trips') return;
  if (S.mode === 'fish') { tickFish(dt); return; }    // the line is in; be still
  if (S.mode === 'play' && S.mapOpen) return;         // the map is a rest stop

  // clock
  var minPerSec = (TUNE.dayEndMin - TUNE.dayStartMin) / TUNE.daySeconds;
  S.clock += minPerSec * dt;
  if (S.clock >= TUNE.roughMin) { roughNight(); return; }
  if (!S.duskWarned && S.clock >= TUNE.duskMin) {
    S.duskWarned = true;
    toast('The light is going — find a campsite (orange sign).');
  }
  if (S.clock < TUNE.duskMin) S.duskWarned = false;

  tickMove(dt, input.x, input.y);
  if (S.suppressCampId) {
    // lifts only on genuinely leaving the ring (the canoe counts — the
    // position check runs while paddling too); contextAction bypasses it
    // in the evening and when exhausted, so an island dawdler can still
    // camp again when camping is the honest intent
    var sup = null, si;
    for (si = 0; si < CAMPSITES.length; si++) {
      if (CAMPSITES[si].id === S.suppressCampId) { sup = CAMPSITES[si]; break; }
    }
    if (!sup || Math.hypot(S.player.x - sup.x, S.player.y - sup.y) > 30) {
      S.suppressCampId = null;
    }
  }
  if (S.campSession) {
    S.sightTarget = null; S.sightT = 0;
    tickCampLife(dt);
  } else {
    tickAnimals(dt);
    tickEvents(dt);
    tickStones();
  }
  tickObjectives();
  tickFx(dt);

  // dusk mosquitoes on land, unless a fire is going nearby
  var duskish = S.clock >= TUNE.duskMin;
  var nearFire = S.campfire && Math.hypot(S.player.x - S.campfire.x, S.player.y - S.campfire.y) < 30;
  S.mosquito = duskish && S.travel !== 'canoe' && !nearFire;
  if (S.mosquito) S.energy = Math.max(0, S.energy - TUNE.mosquitoDrain * dt);

  // only the SHOWING notification ages; the pending one waits its turn
  if (S.toasts.length) {
    S.toasts[0].ttl -= dt;
    if (S.toasts[0].ttl <= 0) S.toasts.shift();
  }

  AUDIO.ambient(dt, {
    onWater: S.travel === 'canoe',
    dusk: duskish,
    campfire: !!nearFire,
    mosquito: !!S.mosquito,
  });
}

function doAction() {
  if (OUTFIT.isOpen()) return;      // nothing happens behind the panel
  if (S.mode === 'title') { S.mode = 'trips'; return; }
  if (S.mode === 'trips') { return; }   // picked by button or 1/2/3
  if (S.mode === 'scene') { if (S.eyesT) return; closeScene(); return; }
  if (S.mode === 'fish') { fishAction(); return; }
  if (S.mode === 'card') {
    if (S.card.kind === 'end') { newTrip(); S.mode = 'trips'; return; }
    if (S.card.kind === 'boxCheck') { S.card = null; S.mode = 'play'; return; }
    if (S.card.kind === 'fireSafety') {
      S.card = null;
      S.mode = S.scene ? 'scene' : 'play';   // back to the (large) fire
      return;
    }
    if (S.card.kind === 'campNight') { showCampMorning(); return; }
    if (S.card.kind === 'campMorning') { breakCamp(); return; }
    nextMorning(S.card.kind === 'rough');
    return;
  }
  if (S.mapOpen) { S.mapOpen = false; return; }
  var a = contextAction();
  if (a) a.act();
}

function eatSnack() {
  if (S.mode !== 'play' || S.mapOpen || OUTFIT.isOpen() || S.snacks <= 0) return;
  S.snacks--;
  S.energy = Math.min(TUNE.energyMax, S.energy + TUNE.snackEnergy);
  AUDIO.chime();
  toast('Snack. ' + S.snacks + ' left.');
}

// dev conveniences, only behind #dev
function devKey(code) {
  if (!DEV) return;
  if (code === 'KeyT') S.clock += 60;
  if (code === 'KeyU') S.energy = TUNE.energyMax;
  if (code === 'KeyY') {
    var t = currentTarget();
    if (t) { S.player.x = t[0]; S.player.y = t[1] - 4;
      if (S.travel !== 'foot') { S.canoe.x = t[0]; S.canoe.y = t[1] - 4; } }
  }
}

</script>
<script>
/* js/camp.js */
// PADDLER'S PARADISE — CAMP (the scene)
// ---------------------------------------------------------------------------
// Camp is a SCENE SWITCH, not a zoom (Evrtek's ruling, v0.3.0): landing at an
// orange sign and making camp fades to a dedicated stage — its own layout,
// its own collision, its own high-fidelity sprite set at double the
// overworld's texel density. The paddling world is the overworld; this is
// the intimate room inside it. Break camp and the overworld fades back in,
// with the trip exactly where you left it.
//
// The stage is one hand-authored campsite every camp shares — the fire ring
// centre-stage, the tent pad up and right, the water along the bottom with
// the canoe pulled up, deadfall back in the trees, the barrel rope on the big
// pine at left, the thunder box discreetly up its path. All chores by
// proximity; every choice keeps its consequence.
// ---------------------------------------------------------------------------

'use strict';

var CAMP = {
  W: 160, H: 100,            // stage size in scene units
  fire:   { x: 80,  y: 48 },
  tent:   { x: 116, y: 34 },
  bench:  { x: 80,  y: 36 },   // just behind the fire, facing it and the lake (#6)
  barrel: { x: 100, y: 56 },   // where the blue barrel sits until it is hung (#14)
  barrelPine: { x: 18, y: 40 },// where it hangs once you have done the right thing
  box:    { x: 143, y: 15 },
  deadwood: [
    { x: 34,  y: 19, kind: 'snag' },
    { x: 124, y: 18, kind: 'snag' },
    { x: 62,  y: 15, kind: 'log'  },
    { x: 40,  y: 48, kind: 'log'  },
  ],
  canoe:  { x: 30,  y: 68 },
  sign:   { x: 102, y: 70 },
  trees: [
    { x: 18,  y: 34, kind: 'hdPine'  },   // the barrel pine, standing apart
    { x: 8,   y: 46, kind: 'hdPine'  },
    { x: 152, y: 40, kind: 'hdPine'  },
    { x: 150, y: 56, kind: 'hdBirch' },
  ],
  rocks: [ { x: 54, y: 58 }, { x: 118, y: 56 }, { x: 140, y: 66 } ],
  treeline: [],              // generated below: the forest wall along the top
  phase: 1.2,                // per-site shoreline character (#4)
  coveX: 30,                 // where the water bites in and the canoe lands
  groundSeed: 0xCA4B1,
  treeSeed: 0,
};

// The shoreline is a CURVE, not a band — the cove is where the canoe is
// pulled up. Shared by the painter, the collision, and the water; its phase
// and cove position are per-site now (#4).
function shoreY(x) {
  return 76
    + Math.sin(x * 0.045 + CAMP.phase) * 3
    + Math.sin(x * 0.013 + CAMP.phase + 0.9) * 4
    - Math.max(0, 8 - Math.abs(x - CAMP.coveX) * 0.35);
}

function buildCampTreeline() {
  // a WALL of forest, crowns overlapping — two staggered passes, with the
  // one gap kept in front of wherever this site's thunder box stands
  CAMP.treeline.length = 0;
  var pass, x;
  for (pass = 0; pass < 2; pass++) {
    x = 3 + pass * 4;
    while (x < 157) {
      var h = ((x + pass * 131 + CAMP.treeSeed * 977) * 2654435761) >>> 0;
      var y = (pass === 0 ? 1 : 6) + (h % 5);
      var kind = (h % 5) < 3 ? 'hdPine' : 'hdBirch';
      var gap = Math.abs(x - CAMP.box.x) < 7 && pass === 1;
      if (!gap) CAMP.treeline.push({ x: x, y: y, kind: kind, front: pass === 1 });
      x += 5 + (h % 4);
    }
  }
  CAMP.treeline.sort(function (a, b) { return a.y - b.y; });
}
buildCampTreeline();

// --- per-site character (#4): mirrors, moved furniture, its own shore ------
var CAMP_BASE = null;
var CAMP_VARIANTS = {
  joe:   { mirror: false, phase: 1.2, coveX: 30,  groundSeed: 0xCA4B1, treeSeed: 0 },
  burnt: { mirror: true,  phase: 2.6, coveX: 130, groundSeed: 0xB0A71, treeSeed: 1,
           canoe: { x: 130, y: 62 }, sign: { x: 58, y: 64 } },
  canoe: { mirror: false, phase: 0.2, coveX: 42,  groundSeed: 0xC0A0E, treeSeed: 2,
           tent: { x: 98, y: 26 }, box: { x: 14, y: 17 }, sign: { x: 120, y: 66 },
           barrel: { x: 62, y: 58 } },
  ljoe:  { mirror: true,  phase: 3.6, coveX: 118, groundSeed: 0x10E77, treeSeed: 3,
           tent: { x: 52, y: 30 }, canoe: { x: 130, y: 64 }, sign: { x: 58, y: 66 } },
};

function applyCampVariant(siteId) {
  if (!CAMP_BASE) {
    CAMP_BASE = JSON.parse(JSON.stringify({
      tent: CAMP.tent, box: CAMP.box, barrel: CAMP.barrel,
      barrelPine: CAMP.barrelPine, canoe: CAMP.canoe, sign: CAMP.sign,
      trees: CAMP.trees, rocks: CAMP.rocks, deadwood: CAMP.deadwood,
    }));
  }
  var b = JSON.parse(JSON.stringify(CAMP_BASE));
  var v = CAMP_VARIANTS[siteId] || CAMP_VARIANTS.joe;
  var mx = function (p) { if (v.mirror) p.x = CAMP.W - p.x; return p; };
  CAMP.tent = mx(b.tent); CAMP.box = mx(b.box); CAMP.barrel = mx(b.barrel);
  CAMP.barrelPine = mx(b.barrelPine); CAMP.canoe = mx(b.canoe); CAMP.sign = mx(b.sign);
  CAMP.trees = b.trees.map(mx); CAMP.rocks = b.rocks.map(mx); CAMP.deadwood = b.deadwood.map(mx);
  var k;
  for (k in v) {
    if (k === 'mirror' || k === 'phase' || k === 'coveX' || k === 'groundSeed' || k === 'treeSeed') continue;
    CAMP[k] = { x: v[k].x, y: v[k].y };
  }
  CAMP.phase = v.phase; CAMP.coveX = v.coveX;
  CAMP.groundSeed = v.groundSeed; CAMP.treeSeed = v.treeSeed;
  buildCampTreeline();
  campGround = null;                 // the painter rebuilds this site's floor
}

// solid things the tripper walks around, not through
function campBlockers() {
  var b = [];
  CAMP.trees.forEach(function (t) { b.push({ x: t.x, y: t.y + 4, r: 2.4 }); });
  CAMP.treeline.forEach(function (t) {
    if (t.front) b.push({ x: t.x, y: t.y + 5, r: 2.2 });
  });
  CAMP.rocks.forEach(function (r) { b.push({ x: r.x, y: r.y, r: 3.4 }); });
  b.push({ x: CAMP.bench.x, y: CAMP.bench.y, r: 2.2 });
  CAMP.deadwood.forEach(function (d) {
    if (d.kind === 'snag') b.push({ x: d.x, y: d.y + 4, r: 2 });
  });
  b.push({ x: CAMP.fire.x, y: CAMP.fire.y, r: 4 });
  b.push({ x: CAMP.box.x, y: CAMP.box.y, r: 3 });
  b.push({ x: CAMP.canoe.x, y: CAMP.canoe.y, r: 4 });
  // no tent blocker: pitching it used to spawn a collider under the player's
  // own feet and freeze them beside it (the drive slept through a whole night
  // because the only button in reach was TURN IN)
  return b;
}

function campPassable(x, y) {
  if (x < 4 || x > CAMP.W - 4) return false;
  if (y < 4 || y > shoreY(x) - 1) return false;      // ankles stay dry
  var bs = campBlockers(), i;
  for (i = 0; i < bs.length; i++) {
    var dx = x - bs[i].x, dy = y - bs[i].y;
    if (dx * dx + dy * dy < bs[i].r * bs[i].r) {
      // never trap someone already inside a blocker — stepping OUT is always
      // legal, or a collider spawned underfoot becomes a cage
      var px = S.player.x - bs[i].x, py = S.player.y - bs[i].y;
      if (px * px + py * py < bs[i].r * bs[i].r) continue;
      return false;
    }
  }
  return true;
}

function enterCamp(site) {
  // remember exactly where the overworld trip pauses
  S.campReturn = { x: S.player.x, y: S.player.y };
  applyCampVariant(site.id);                          // this site's own face (#4)
  var spawnX = CAMP.coveX + (CAMP.coveX < 80 ? 14 : -14);
  S.player.x = spawnX; S.player.y = shoreY(spawnX) - 6;
  S.player.ang = -Math.PI / 2;
  S.campSession = {
    site: site,
    chores: { tent: false, wood: 0, fire: false, cooked: false,
              barrel: false, box: 0, stars: false, satTonight: false },
    guided: S.stats.camps === 0,
    critters: [], critT: 6,
    barrelPos: { x: CAMP.barrel.x, y: CAMP.barrel.y },   // where it rests (#2)
    carryingBarrel: false,
    sources: CAMP.deadwood.map(function (d) {
      return { x: d.x, y: d.y, kind: d.kind, chops: 0, done: false };
    }),
    chopT: 0, chopAt: null, chopHit: false, chips: [],
    fireFuel: 0, logsAdded: 0, fireDied: false, emberMin: 0,
    capSpam: 0, safetyShown: false,
    visitor: null,
    visitorDone: S.rnd() < 0.35,   // some evenings, nobody passes (#5)
    visitorWait: 8 + S.rnd() * 22,
  };
  S.fadeT = performance.now();                       // the scene fades in
  toast('Camp at ' + site.name + '.');
  if (S.campSession.guided) toast('First: pitch the tent on the flat spot.');
}

function leaveCampWorld() {
  // back to the overworld, exactly where the trip paused
  if (S.campReturn) {
    S.player.x = S.campReturn.x;
    S.player.y = S.campReturn.y;
    S.campReturn = null;
  }
  S.fadeT = performance.now();
}

function campNear(p, d) {
  return Math.hypot(S.player.x - p.x, S.player.y - p.y) < (d || 12);
}

/**
 * The context action while at camp: gather every station in reach, serve the
 * NEAREST. All positions are stage coordinates.
 */
function campAction() {
  var cs = S.campSession;
  if (!cs) return null;
  var ch = cs.chores;

  // mid-swing (and for a beat after a tree finishes) the axe owns the
  // button: no chore can be mash-triggered through the end of a chop —
  // the fleet walked a finishing press straight into TURN IN
  if (cs.chopT > 0 || (cs.actCool || 0) > 0) return null;

  // both hands are full: hang it or set it down, nothing else (#2)
  if (cs.carryingBarrel) {
    var dPine = Math.hypot(S.player.x - CAMP.barrelPine.x, S.player.y - CAMP.barrelPine.y);
    if (dPine < 12) {
      return { label: 'HANG THE BARREL', act: function () {
        cs.carryingBarrel = false;
        ch.barrel = true;
        toast('Barrel high on the pine, well off the ground. Sleep easier.');
      } };
    }
    return { label: 'SET BARREL DOWN', act: function () {
      cs.carryingBarrel = false;
      cs.barrelPos = { x: S.player.x, y: S.player.y + 2 };
      toast('The barrel rests where you drop it. Bears take note.');
    } };
  }

  var cands = [];
  var add = function (p, r, label, act) {
    var d = Math.hypot(S.player.x - p.x, S.player.y - p.y);
    if (d < r) cands.push({ d: d, label: label, act: act });
  };

  add(CAMP.tent, 13, ch.tent ? 'TURN IN' : 'PITCH TENT', ch.tent ? finishCampNight : function () {
    ch.tent = true;
    toast('Tent up. Home for the night.');
    if (cs.guided) toast('Dead trees stand at the wood\'s edge — the axe wants work.');
  });

  // firewood is chopped, not found stacked: each dead tree takes a few
  // swings of the axe to buck into an armload
  cs.sources.forEach(function (sc) {
    if (sc.done) return;
    add(sc, 9, 'CHOP WOOD', function () {
      if (cs.chopT > 0) return;              // mid-swing already
      cs.chopT = 0.0001;
      cs.chopAt = sc;
      cs.chopHit = false;
      AUDIO.chop(0.2);                        // the thock lands with the blade
    });
  });

  if (!ch.fire) {
    add(CAMP.fire, 12, ch.wood >= 6 ? 'LIGHT FIRE' : 'NEED MORE WOOD', ch.wood >= 6 ? function () {
      ch.fire = true;
      ch.wood -= 6;                     // six split logs build the base
      cs.fireFuel = 5;
      // logsAdded and fireDied are EVENING ledgers, not per-lighting: a
      // relit fire does not erase the lapse the night card should mention
      S.campfire = { x: CAMP.fire.x, y: CAMP.fire.y };
      toast('The fire catches. Mosquitoes keep their distance.');
      if (cs.guided) toast('Dinner cooks over a real fire.');
    } : function () {
      toast('The ring wants ' + (6 - ch.wood) + ' more split log' + (6 - ch.wood === 1 ? '' : 's') + '.');
    });
  } else if (!ch.cooked) {
    add(CAMP.fire, 12, S.food > 0 ? 'COOK DINNER' : 'BARREL IS EMPTY', S.food > 0 ? function () {
      ch.cooked = true; S.food--;
      S.energy = TUNE.energyMax;               // a hot meal fills the whole bar (#6)
      toast('Dinner over the fire — you feel whole again.' + (S.food === 0 ? ' That was the last of the barrel.' : ''));
      if (cs.guided) toast('Hang the barrel on the big pine — bears know campsites.');
    } : function () {
      toast('Nothing left to cook. A fish tomorrow would fix that.');
    });
  }

  if (!ch.barrel) add(cs.barrelPos, 9, 'PICK UP THE BARREL', function () {
    cs.carryingBarrel = true;
    toast('Sixty pounds of dinners. Now, the big pine.');
    if (cs.guided) toast('Carry it to the big pine at the ' +
      (CAMP.barrelPine.x < 80 ? 'left' : 'right') + ' and hang it.');
  });

  add(CAMP.box, 11, 'VISIT THE THUNDER BOX', function () {
    ch.box++;
    S.stats.boxUses++;
    if (ch.box === 1) {
      S.energy = Math.min(TUNE.energyMax, S.energy + 4);
      toast('The throne of the interior. No further comment.');
    } else if (ch.box === 2) {
      S.energy = Math.min(TUNE.energyMax, S.energy + 1);
      toast('Back already? The chipmunks are starting to talk.');
    } else if (ch.box === 3) {
      S.card = {
        title: 'A DELICATE QUESTION',
        lines: ['Three visits before bedtime.',
                'Feeling alright out there, tripper?',
                'Maybe go easier on the lake coffee.'],
        button: 'NEVER BETTER', kind: 'boxCheck',
      };
      S.mode = 'card';
    } else {
      toast('The box creaks in weary recognition.');
    }
  });

  // living trees are spoken for (#3): the axe refuses, three ways
  CAMP.trees.forEach(function (tr) {
    add({ x: tr.x, y: tr.y + 4 }, 8, 'CHOP TREE', function () {
      cs.greenChops = (cs.greenChops || 0) + 1;
      toast(cs.greenChops === 1
        ? 'The axe stops an inch from green bark. Living trees stay standing.'
        : cs.greenChops === 2
        ? 'Still alive, still spoken for — the DEAD trees are the firewood.'
        : 'The pine declines. Firmly.');
    });
  });

  // the bench faces the fire with the whole lake behind it — sit, and the
  // screen becomes the view (#6, #7). Time keeps flowing while you watch.
  add(CAMP.bench, 9, ch.fire ? 'WATCH THE FIRE' : 'SIT A WHILE', function () {
    if (!ch.satTonight) { ch.satTonight = true; S.stats.fireSits++; }
    var hh = hourNow();
    if (hh >= 19.6 && !ch.stars) {
      ch.stars = true;
      S.log.push('Day ' + S.day + ' — watched the stars come out over the lake.');
    }
    var cap = hh >= 20.3 ? 'Sparks climb. The stars hold still.'
      : hh >= 18.6 ? 'The sun leans on the far treeline. Stay for this.'
      : 'The lake breathes. You match it.';
    openScene('firewatch', cap, 'time keeps moving — tap to stand up', true);
  });

  // deciding not to stay is allowed (#2): the canoe is right there
  var canoeNearReturn = S.campReturn &&
    Math.hypot(S.canoe.x - S.campReturn.x, S.canoe.y - S.campReturn.y) < 60;
  add(CAMP.canoe, 10, canoeNearReturn ? 'PADDLE ON' : 'MOVE ON', function () {
    cancelCamp();                            // back on the overworld, camp struck
    var close = Math.hypot(S.canoe.x - S.player.x, S.canoe.y - S.player.y) < 60;
    var w = waterNearby();
    if (!w && close) {
      // the beached canoe is guaranteed to sit at the water's edge — probe
      // from THERE when the camp stood too far inland
      var sx0 = S.player.x, sy0 = S.player.y;
      S.player.x = S.canoe.x; S.player.y = S.canoe.y;
      w = waterNearby();
      if (!w) { S.player.x = sx0; S.player.y = sy0; }
    }
    if (w && close) { putIn(w); toast('Not tonight — you push off again.'); }
    else toast('You walk back out. The site keeps its silence.');
  });

  if (!cands.length) return null;
  cands.sort(function (a, b) { return a.d - b.d; });
  return cands[0];
}

// --- the night, and the morning after ----------------------------------------

function cancelCamp() {
  if (S.campSession) S.suppressCampId = S.campSession.site.id;
  S.campSession = null;
  S.campfire = null;
  leaveCampWorld();
}

/**
 * Camp has small lives of its own (#15): chipmunks and red squirrels dart in
 * from the treeline, check a rock or the woodpile for crumbs, and dart back.
 * Come at one too fast and it leaves early.
 */
function tickCampLife(dt) {
  var cs = S.campSession;
  if (!cs) return;

  // the axe swing: raised, falling, impact at 0.24s, recovered by 0.42s
  if (cs.chopT > 0) {
    cs.chopT += dt;
    if (!cs.chopHit && cs.chopT >= 0.24 && cs.chopAt) {
      cs.chopHit = true;
      var sc2 = cs.chopAt;
      sc2.chops++;
      S.energy = Math.max(0, S.energy - TUNE.chopEnergy);
      var ci;
      for (ci = 0; ci < 5; ci++) {
        cs.chips.push({
          x: sc2.x + (S.rnd() - 0.5) * 2.5,
          y: sc2.y - (sc2.kind === 'snag' ? 0 : 1),
          vx: (S.rnd() - 0.5) * 26, vy: -14 - S.rnd() * 16,
          ttl: 0.45 + S.rnd() * 0.3,
        });
      }
      if (sc2.chops >= TUNE.chopSwings) {
        sc2.done = true;
        cs.actCool = 0.5;               // a breath before the next station answers
        cs.chores.wood += TUNE.logsPerTree;
        toast('Split and stacked — ' + TUNE.logsPerTree + ' logs (' + cs.chores.wood + ' in the pile).');
        if (cs.guided && cs.chores.wood >= 6 && !cs.chores.fire) toast('Enough to burn — light the fire ring.');
      }
    }
    if (cs.chopT >= 0.42) { cs.chopT = 0; cs.chopAt = null; }
  }
  if (cs.actCool > 0) cs.actCool -= dt;
  var wi;
  for (wi = cs.chips.length - 1; wi >= 0; wi--) {
    var cp = cs.chips[wi];
    cp.vy += 70 * dt;
    cp.x += cp.vx * dt;
    cp.y += cp.vy * dt;
    cp.ttl -= dt;
    if (cp.ttl <= 0) cs.chips.splice(wi, 1);
  }
  if (!cs.critters) { cs.critters = []; cs.critT = 6; }
  cs.critT -= dt;
  if (cs.critT <= 0 && cs.critters.length < 2) {
    cs.critT = TUNE.critterEvery * (0.6 + S.rnd() * 0.9);
    var targets = [CAMP.rocks[0], CAMP.rocks[1], CAMP.deadwood[0], CAMP.deadwood[3], CAMP.sign];
    var tgt = targets[Math.floor(S.rnd() * targets.length)];
    var x0 = 10 + S.rnd() * (CAMP.W - 20);
    var tx0 = tgt.x + (S.rnd() - 0.5) * 6;
    var ty0 = tgt.y + 3 + (S.rnd() - 0.5) * 3;
    if (ty0 > shoreY(tx0) - 2) ty0 = shoreY(tx0) - 2;   // paws stay dry
    cs.critters.push({
      kind: S.rnd() < 0.65 ? 'hdChip' : 'hdSquirrel',
      x: x0, y: 7 + S.rnd() * 4, ex: x0, ey: 6,
      tx: tx0, ty: ty0,
      phase: 'in', pause: 1 + S.rnd() * 2, anim: 0, face: 1,
    });
  }
  var i;
  for (i = cs.critters.length - 1; i >= 0; i--) {
    var c = cs.critters[i];
    c.anim += dt * 10;
    // a heavy footstep nearby ends the visit
    if (c.phase !== 'out' &&
        Math.hypot(S.player.x - c.x, S.player.y - c.y) < 9 && S.player.speed > 20) {
      c.phase = 'out';
    }
    if (c.phase === 'pause') {
      c.pause -= dt;
      if (c.pause <= 0) c.phase = 'out';
      continue;
    }
    var gx = c.phase === 'in' ? c.tx : c.ex;
    var gy = c.phase === 'in' ? c.ty : c.ey;
    var dx = gx - c.x, dy = gy - c.y, d = Math.hypot(dx, dy);
    if (d < 1.5) {
      if (c.phase === 'in') c.phase = 'pause';
      else cs.critters.splice(i, 1);
      continue;
    }
    var sp = c.phase === 'out' ? 42 : 30;
    var nx2 = c.x + (dx / d) * sp * dt;
    var ny2 = c.y + (dy / d) * sp * dt;
    // never through the fire, the box, the canoe — or into the lake
    var solids = [
      { x: CAMP.fire.x, y: CAMP.fire.y, r: 5 },
      { x: CAMP.box.x, y: CAMP.box.y, r: 3 },
      { x: CAMP.canoe.x, y: CAMP.canoe.y, r: 4 },
    ];
    var blocked = ny2 > shoreY(nx2) - 1, bi;
    for (bi = 0; bi < solids.length && !blocked; bi++) {
      var bdx = nx2 - solids[bi].x, bdy = ny2 - solids[bi].y;
      if (bdx * bdx + bdy * bdy < solids[bi].r * solids[bi].r) blocked = true;
    }
    if (blocked) {
      var px2 = c.x - (dy / d) * sp * dt, py2 = c.y + (dx / d) * sp * dt;
      if (py2 <= shoreY(px2) - 1) { c.x = px2; c.y = py2; }
      else c.phase = 'out';                 // skirting failed; call it a day
    } else { c.x = nx2; c.y = ny2; }
    if (dx > 0.5) c.face = 1; else if (dx < -0.5) c.face = -1;
  }
}

/**
 * The fire burns DOWN while you sit with it (Evrtek's firewatch minigame):
 * a bigger fire eats faster, embers warn you, and an untended fire dies —
 * relighting costs six fresh logs. Runs only inside the firewatch scene.
 */
function sceneSay(msg) {
  if (!S.scene) return;
  S.scene.caption = msg;
  S.scene.capT = performance.now();
  S.scene.capHold = performance.now() + 6500;   // the hourly caption waits
}

function tickFireTending(gameMin) {
  var cs = S.campSession;
  if (!cs || !cs.chores.fire) return;
  var burn = (0.022 + cs.fireFuel * 0.0075) * TUNE.fireBurn;   // 6 logs lasts an honest evening
  cs.fireFuel = Math.max(0, cs.fireFuel - burn * gameMin);
  if (cs.fireFuel <= 0.01) {
    cs.emberMin += gameMin;
    if (!cs.warnedEmbers) {
      cs.warnedEmbers = true;
      sceneSay('Down to embers — feed the fire or lose it.');
    }
    if (cs.emberMin > 20) {
      cs.chores.fire = false;
      cs.fireDied = true;
      S.stats.fireDied++;
      S.campfire = null;
      sceneSay('The fire is out. The dark feels bigger than it was.');
    }
  } else {
    cs.emberMin = 0;
    cs.warnedEmbers = false;
  }
}

/**
 * Someone paddles by while you sit with the fire (#5) — about once a day.
 * A wave is optional. Waving is correct.
 */
function tickVisitor(dt) {
  var cs = S.campSession;
  if (!cs || cs.visitorDone) return;
  if (!cs.visitor) {
    cs.visitorWait -= dt;
    if (cs.visitorWait <= 0) {
      cs.visitor = {
        t: 0, dur: 22,
        dir: S.rnd() < 0.5 ? 1 : -1,
        lane: S.rnd(),
        waved: false, wavedBack: 0,
      };
    }
    return;
  }
  var v = cs.visitor;
  v.t += dt;
  if (v.wavedBack > 0) v.wavedBack -= dt;
  if (v.t > v.dur) { cs.visitor = null; cs.visitorDone = true; }
}

function waveAtVisitor() {
  var cs = S.campSession;
  if (!cs || !cs.visitor || cs.visitor.waved) return;
  if (S.mode !== 'scene' || !S.scene || S.scene.name !== 'firewatch') return;
  cs.visitor.waved = true;
  cs.visitor.wavedBack = 3;
  S.stats.waves++;
  AUDIO.hail();
  sceneSay('You raise a hand. They lift a paddle in reply.');
}

function addFireLog() {
  var cs = S.campSession;
  if (!cs || S.mode !== 'scene' || !S.scene || S.scene.name !== 'firewatch') return;
  if (!cs.chores.fire) { sceneSay('Only cold stone here now. Six logs would start again.'); return; }
  if (cs.chores.wood <= 0) { sceneSay('No split wood left — the axe waits by the dead trees.'); return; }
  if (cs.fireFuel >= 12) {
    cs.capSpam++;                        // hammering a full ring IS the signal
    sceneSay('The ring cannot hold more than this.');
    maybeFireSafety(cs);
    return;
  }
  cs.chores.wood--;
  cs.fireFuel = Math.min(12, cs.fireFuel + 1);
  cs.logsAdded++;
  cs.capSpam = 0;
  S.stats.logsFed++;
  AUDIO.feed();
  maybeFireSafety(cs);
}

/** Ten logs in an evening — or five taps at a full ring — earns the word. */
function maybeFireSafety(cs) {
  if (cs.safetyShown) return;
  if (cs.logsAdded < 10 && cs.capSpam < 5) return;
  cs.safetyShown = true;
  S.card = {
    title: 'A WORD ON FIRE SAFETY',
    lines: ['Ten logs. The fire is taller than you.',
            'This is a campfire, not a signal pyre.',
            'The rangers, the bears and the loons',
            'are all pretending not to stare.'],
    button: 'POINT TAKEN', kind: 'fireSafety',
  };
  S.mode = 'card';
}

function finishCampNight() {
  var cs = S.campSession, ch = cs.chores;
  S.lastCamp = cs.site.id;
  S.stats.camps++;
  S.stats.sites[cs.site.id] = true;
  if (ch.cooked) S.stats.cooked++;
  if (ch.barrel) S.stats.hung++;
  if (ch.stars) S.stats.stars++;
  S.lookUp = false;                                 // the evening is spoken for

  // the bear ledger: an unhung barrel with food in it is an invitation
  cs.bearRaid = !ch.barrel && S.food > 0 && S.rnd() < TUNE.bearRaidChance;

  var lines = sleepLine([]);
  lines.push(ch.cooked ? 'Fed, warm' + (ch.fire ? ', fire settling to coals.' : '.')
                       : 'No dinner tonight.');
  lines.push(ch.barrel ? 'The barrel hangs far off in the dark.'
                       : 'The barrel sits by the tent. Probably fine.');
  if (cs.fireDied) lines.push('The fire went out on your watch. It happens once.');
  else if (cs.logsAdded >= 6) {
    lines.push('The fire was fed all evening — kept to the last.');
    S.stats.tended++;
  }
  if (ch.stars) lines.push('The sky did its work. Sleep comes easy.');
  if (sightingsToday() > 0) lines.push(sightingsToday() + ' sighting' + (sightingsToday() > 1 ? 's' : '') + ' in the journal today.');

  S.log.push('Day ' + S.day + ' — camped at ' + cs.site.name + '.');
  S.card = { title: 'NIGHT ' + S.day, lines: lines, button: 'SLEEP', kind: 'campNight' };
  S.mode = 'card';
}

function showCampMorning() {
  var cs = S.campSession;
  var lines = [];
  if (cs.bearRaid) {
    S.stats.bearRaids++;
    S.food = Math.max(0, S.food - 1);
    lines.push('Dawn. The barrel is TIPPED and clawed open —');
    lines.push('a bear took a meal in the night. Hang it next time.');
  } else {
    lines.push('Dawn, and mist on the water.');
  }
  if (S.food > 0) {
    S.food--;
    cs.breakfast = true;
    S.energy = TUNE.energyMax;                 // breakfast counts too (#6)
    lines.push('Breakfast: oatmeal and lake coffee.');
  } else {
    lines.push('Nothing for breakfast. The rod is in the canoe.');
  }
  lines.push('Pack up, load the canoe, back on the water.');
  S.card = { title: 'DAY ' + (S.day + 1), lines: lines, button: 'BREAK CAMP', kind: 'campMorning' };
}

function breakCamp() {
  var cs = S.campSession, ch = cs.chores;
  S.fish = null;
  S.lookUp = false;
  S.day++;
  S.clock = TUNE.dayStartMin + 45;                  // 06:45, packed and moving
  S.energy = Math.max(S.energy, 70);        // sleep gives a floor; meals fill
  if (!cs.breakfast) S.energy = Math.max(40, S.energy - 12);
  S.wind = rollWind(S.rnd, S.day);
  S.campfire = null;
  S.suppressCampId = S.campSession.site.id;   // quiet until you leave the ring
  S.campSession = null;
  leaveCampWorld();
  spawnAnimals();
  planDay();
  S.card = null;
  S.mode = 'play';
  AUDIO.morning();
  tickObjectives();
  toast('Day ' + S.day + ' — ' + (OBJS[S.objIndex] ? OBJS[S.objIndex].text : 'homeward.'));
}

</script>
<script>
/* js/render.js */
// PORTAGE — RENDERER
// ---------------------------------------------------------------------------
// One art-resolution framebuffer, upscaled once with nearest-neighbour, so
// every sprite, ripple and letter sits on the same pixel grid. The terrain is
// rasterised to an offscreen canvas a single time; each frame blits the
// visible window of it and draws entities over the top, painter's order.
// ---------------------------------------------------------------------------

'use strict';

// Two framebuffer texels per world unit (v0.2.0): the world draws at double
// density and upscales once. The on-screen framing is unchanged — only the
// grain is finer. Device scale is kept EVEN so fb texels map to a whole
// number of device pixels and nothing shimmers.
var RES = 2;

var R = {
  canvas: null, ctx: null,
  fb: null, g: null,               // framebuffer + its context
  scale: 3, artW: 320, artH: 240,
  cz: 1, czT: 0,                   // camp zoom, smoothed (Evrtek: camp is a
  viewW: 320, viewH: 240,          // zone, dramatically zoomed — a minigame
                                   // inside the game world)
  terrain: null,
  camX: 0, camY: 0,
  buttons: {},                     // art-space hit rects, rebuilt every frame
  joyView: null,                   // set by main.js when a touch stick is live
};

function initRender(canvas) {
  R.canvas = canvas;
  R.ctx = canvas.getContext('2d');
  R.fb = document.createElement('canvas');
  R.g = R.fb.getContext('2d');
  onResize();
  window.addEventListener('resize', onResize);
  prerenderTerrain();
}

function onResize() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = Math.round(window.innerWidth * dpr);
  var h = Math.round(window.innerHeight * dpr);
  // A hidden or still-loading tab can report 0x0; building a zero-size
  // framebuffer would poison every drawImage after it. Wait and retry.
  if (w < 8 || h < 8) { setTimeout(onResize, 200); return; }
  R.canvas.width = w; R.canvas.height = h;
  R.canvas.style.width = window.innerWidth + 'px';
  R.canvas.style.height = window.innerHeight + 'px';
  // Pick the scale from BOTH axes (~240 world units on the short side, at
  // most ~470 on the long one), then round UP to an even number so each 2x
  // framebuffer texel lands on a whole number of device pixels.
  var s0 = Math.max(2,
    Math.floor(Math.min(w, h) / 210),
    Math.ceil(Math.max(w, h) / 470));
  R.scale = s0 + (s0 % 2);
  R.artW = Math.ceil(w / R.scale);
  R.artH = Math.ceil(h / R.scale);
  R.fb.width = R.artW * RES; R.fb.height = R.artH * RES;
  R.ctx.imageSmoothingEnabled = false;
  R.g.imageSmoothingEnabled = false;
}

// --- terrain, once -----------------------------------------------------------

function prerenderTerrain() {
  var c = document.createElement('canvas');
  c.width = WORLD.W * RES; c.height = WORLD.H * RES;
  var g = c.getContext('2d');
  var CELL = WORLD.CELL, gx, gy;

  for (gy = 0; gy < GH; gy++) {
    for (gx = 0; gx < GW; gx++) {
      var t = GRID[gy * GW + gx];
      var v = (gx * 7 + gy * 13) % 5;           // quiet per-cell variation
      var col;
      if (t === WORLD.DEEP)         col = v ? PAL.deep : PAL.water;
      else if (t === WORLD.WATER)   col = v ? PAL.water : PAL.deep;
      else if (t === WORLD.SHALLOW) col = v ? PAL.shallow : PAL.water;
      else if (t === WORLD.SAND)    col = v ? PAL.sand : PAL.sandDk;
      else if (t === WORLD.TRAIL)   col = v ? PAL.trail : PAL.trailDk;
      else                          col = v === 0 ? PAL.grassDk : (v === 3 ? PAL.forest : PAL.grass);
      g.fillStyle = col;
      g.fillRect(gx * CELL * RES, gy * CELL * RES, CELL * RES, CELL * RES);
    }
  }

  // the dock: planks into Canoe Lake, drawn at texel resolution
  g.fillStyle = PAL.dock;
  g.fillRect((POIS.dock.x - 3) * RES, (POIS.dock.y - 16) * RES, 6 * RES, 20 * RES);
  g.fillStyle = PAL.dockDk;
  for (var py = POIS.dock.y - 14; py < POIS.dock.y + 2; py += 3) {
    g.fillRect((POIS.dock.x - 3) * RES, py * RES, 6 * RES, 1);
  }

  // lilies are furniture, not actors — bake them (2x sprites draw 1:1 here)
  LILIES.forEach(function (l) {
    g.drawImage(SPRITES.lily, Math.round(l.x * RES - 6), Math.round(l.y * RES - 3));
  });

  // reeds: short strokes leaning out of the shallows (#11)
  REEDS.forEach(function (r) {
    var i2, h2 = ((r.x * 31 + r.y * 17) | 0);
    for (i2 = 0; i2 < r.n; i2++) {
      var ox = ((h2 >> i2) % 5) - 2 + i2 * 2;
      g.fillStyle = (i2 + h2) % 2 ? PAL.pineLt : PAL.trail;
      g.fillRect(Math.round((r.x + ox) * RES), Math.round((r.y - 3) * RES), 1, 3 * RES);
      g.fillStyle = PAL.trailDk;
      g.fillRect(Math.round((r.x + ox) * RES), Math.round((r.y - 0.5) * RES), 1, RES);
    }
  });

  // shore stones: grey backs just breaking the surface (#18)
  STONES.forEach(function (s) {
    g.fillStyle = PAL.rockDk;
    g.fillRect(Math.round((s.x - s.r) * RES), Math.round((s.y - s.r * 0.7) * RES),
      Math.round(s.r * 2 * RES), Math.round(s.r * 1.4 * RES));
    g.fillStyle = PAL.rock;
    g.fillRect(Math.round((s.x - s.r * 0.6) * RES), Math.round((s.y - s.r * 0.7) * RES),
      Math.round(s.r * 1.2 * RES), Math.round(s.r * 0.6 * RES));
    g.fillStyle = PAL.ripple;
    g.fillRect(Math.round((s.x - s.r - 1) * RES), Math.round((s.y + s.r * 0.6) * RES),
      Math.round((s.r * 2 + 2) * RES), 1);
  });

  // deadheads: a dark tip and a ring of stillness around it (#11)
  DEADHEADS.forEach(function (d) {
    g.save();
    g.translate(d.x * RES, d.y * RES);
    g.rotate(d.a);
    g.fillStyle = PAL.trunk;
    g.fillRect(-1 * RES, -3 * RES, 2 * RES, 6 * RES);
    g.fillStyle = PAL.trunkLt;
    g.fillRect(-1 * RES, -3 * RES, 2 * RES, RES);
    g.restore();
    g.fillStyle = PAL.ripple;
    g.fillRect(Math.round((d.x - 3) * RES), Math.round((d.y + 3) * RES), 6 * RES, 1);
  });

  R.terrain = c;
}

// --- helpers -------------------------------------------------------------------

function sx(x) { return x - R.camX; }
function sy(y) { return y - R.camY; }

function drawSprite(name, x, y, ang) {
  var s = SPRITES[name];
  var dw = s.width / RES, dh = s.height / RES;   // world-unit footprint
  var rx = Math.round(sx(x) * RES) / RES, ry = Math.round(sy(y) * RES) / RES;
  if (ang === undefined || ang === null) {
    R.g.drawImage(s, rx - dw / 2, ry - dh / 2, dw, dh);
    return;
  }
  R.g.save();
  R.g.translate(rx, ry);
  R.g.rotate(ang);
  R.g.drawImage(s, -dw / 2, -dh / 2, dw, dh);
  R.g.restore();
}

function text(str, x, y, col, size, align) {
  // Regular text, per Evrtek: the UI pass renders at device resolution, so
  // this is a real font drawn crisp — only the WORLD is pixel art.
  R.g.font = '600 ' + (size || 7) + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  R.g.textAlign = align || 'left';
  R.g.textBaseline = 'top';
  R.g.fillStyle = 'rgba(8,12,10,0.75)';
  R.g.fillText(str, x + 0.5, y + 0.5);
  R.g.fillStyle = col || PAL.white;
  R.g.fillText(str, x, y);
}

function speakerPill(x, y, w, h, muted) {
  var g = R.g;
  g.fillStyle = PAL.uiBg;
  g.fillRect(x, y, w, h);
  g.strokeStyle = PAL.white;
  g.lineWidth = 2 / R.scale;
  g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  var cx = x + w / 2 - 3, cy = y + h / 2;
  g.fillStyle = PAL.white;
  g.fillRect(cx - 4, cy - 2, 3, 4);              // the driver box
  g.beginPath();                                  // the cone
  g.moveTo(cx - 1, cy - 2);
  g.lineTo(cx + 3, cy - 5);
  g.lineTo(cx + 3, cy + 5);
  g.lineTo(cx - 1, cy + 2);
  g.closePath();
  g.fill();
  if (muted) {
    g.strokeStyle = PAL.bad;
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(cx + 5, cy - 4); g.lineTo(cx + 10, cy + 4);
    g.moveTo(cx + 10, cy - 4); g.lineTo(cx + 5, cy + 4);
    g.stroke();
  } else {
    g.strokeStyle = PAL.white;
    g.lineWidth = 1;
    g.beginPath(); g.arc(cx + 4.5, cy, 3, -0.9, 0.9); g.stroke();
    g.beginPath(); g.arc(cx + 4.5, cy, 5.5, -0.8, 0.8); g.stroke();
  }
}

function pill(x, y, w, h, label, col) {
  R.g.fillStyle = PAL.uiBg;
  R.g.fillRect(x, y, w, h);
  R.g.strokeStyle = col || PAL.gold;
  R.g.lineWidth = 2 / R.scale;
  R.g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  text(label, x + w / 2, y + (h - 7) / 2 + 0.5, col || PAL.gold, 7, 'center');
}

// --- the frame -------------------------------------------------------------------

function draw(state, nowMs) {
  var g = R.g;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, R.fb.width, R.fb.height);

  // the campsite is a scene of its own: a dedicated stage at double the
  // overworld's texel density (Evrtek: a switch, not a zoom). A card raised
  // from INSIDE a first-person scene keeps that scene as its backdrop.
  if (state.campSession && state.mode !== 'scene' &&
      !(state.mode === 'card' && state.scene)) {
    drawCampScene(state, nowMs);
    drawFade(state, nowMs);
    present();
    uiPass(function () {
      if (state.mapOpen) drawMap(state);
      else drawHUD(state, nowMs);
      if (state.mode === 'card') drawCard(state);
    });
    return;
  }

  // a scene owns the whole screen: first-person, full bleed (#6, #9) —
  // and it stays the backdrop when a card opens from within it
  if (state.scene && (state.mode === 'scene' || state.mode === 'card')) {
    g.setTransform(RES, 0, 0, RES, 0, 0);
    SCENE_PAINTERS[state.scene.name](g, R.artW, R.artH,
      (nowMs - state.scene.t0) / 1000, rngFrom(state.scene.seed));
    if (state.eyesT) drawEyelids(state, nowMs);
    present();
    uiPass(function () {
      if (state.mode === 'card') { drawCard(state); return; }
      if (state.eyesT) { R.buttons = {}; }
      else drawSceneUI(state);
    });
    return;
  }



  if (state.mode === 'title') {
    present();                       // clears to the framebuffer (empty)
    uiPass(function () { drawTitle(nowMs); });
    return;
  }

  if (state.mode === 'trips') {
    present();
    uiPass(function () { drawTrips(state, nowMs); });
    return;
  }

  // (the camp zoom of v0.2.1 was retired the same day: camp is a full SCENE
  // SWITCH now — see drawCampScene — so the overworld always renders at 1)
  var czTarget = 1;
  var czNow = nowMs;
  var czDt = Math.min(0.1, (czNow - (R.czT || czNow)) / 1000);
  R.czT = czNow;
  R.cz += (czTarget - R.cz) * Math.min(1, czDt * 3.2);
  if (Math.abs(R.cz - czTarget) < 0.01) R.cz = czTarget;
  var cz = R.cz;
  R.viewW = R.artW / cz;
  R.viewH = R.artH / cz;

  // camera — when the viewport out-sizes the world on an axis, centre the
  // world instead of letting the min/max clamp invert
  R.camX = R.viewW >= WORLD.W ? (WORLD.W - R.viewW) / 2
    : Math.max(0, Math.min(WORLD.W - R.viewW, state.player.x - R.viewW / 2));
  R.camY = R.viewH >= WORLD.H ? (WORLD.H - R.viewH) / 2
    : Math.max(0, Math.min(WORLD.H - R.viewH, state.player.y - R.viewH / 2));

  // everything in the world pass is drawn in world units under a xRES·zoom
  // transform, straight onto the 2x framebuffer
  g.setTransform(RES * cz, 0, 0, RES * cz, 0, 0);

  // terrain window (source rect kept inside the terrain canvas)
  var tsx = Math.max(0, R.camX), tsy = Math.max(0, R.camY);
  var tdx = Math.max(0, -R.camX), tdy = Math.max(0, -R.camY);
  var tw = Math.min(R.viewW - tdx, WORLD.W - tsx), th = Math.min(R.viewH - tdy, WORLD.H - tsy);
  g.fillStyle = PAL.forest;
  g.fillRect(0, 0, R.viewW + 1, R.viewH + 1);
  g.drawImage(R.terrain, tsx * RES, tsy * RES, tw * RES, th * RES, tdx, tdy, tw, th);

  drawCampRings(state, nowMs);
  drawWater(state, nowMs);
  drawPoiBeckons(state, nowMs);
  drawEntities(state, nowMs);
  if (state.squall) drawRain(state, nowMs);
  drawDayTint(state);
  drawFade(state, nowMs);

  present();
  uiPass(function () {
    drawLakeNames(state);
    drawMarker(state, nowMs);
    if (state.mapOpen) drawMap(state);
    else drawHUD(state, nowMs);
    if (state.mode === 'card') drawCard(state);
  });
}

/**
 * Lake names, laid gently over the middle of their water (#8): regular text,
 * semi-transparent white, so you always know what you are paddling.
 */
function drawLakeNames(state) {
  if (state.mapOpen || state.mode === 'card') return;
  var g = R.g;
  LAKE_POLYS.forEach(function (l) {
    var x = (l.cx - R.camX) * R.cz, y = (l.cy - R.camY) * R.cz;
    if (x < -80 || x > R.artW + 80 || y < -20 || y > R.artH + 20) return;
    var size = l.big ? 13 : 9;
    g.font = '600 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = 'rgba(10,20,26,0.25)';
    g.fillText(l.name.toUpperCase(), x + 0.5, y + 0.5);
    g.fillStyle = 'rgba(255,255,255,0.38)';
    g.fillText(l.name.toUpperCase(), x, y);
  });
  g.textBaseline = 'top';
}

/**
 * The vistas call out (#2): a gold four-point star bobbing over every place
 * worth looking at, with a slow pulse ring — dimming once you have been.
 */
function drawPoiBeckons(state, nowMs) {
  var g = R.g;
  INSPECTS.forEach(function (p) {
    if (p.x < R.camX - 30 || p.x > R.camX + R.viewW + 30 ||
        p.y < R.camY - 30 || p.y > R.camY + R.viewH + 30) return;
    var seen = !!state.seenPOIs[p.scene];
    var bob = Math.sin(nowMs / 320 + p.x * 0.1) * 1.6;
    var x = sx(p.x), y = sy(p.y) - 11 + bob;
    var a = seen ? 0.25 : 0.9;
    // the star
    g.fillStyle = seen ? 'rgba(242,242,232,' + a + ')' : 'rgba(242,193,75,' + a + ')';
    g.fillRect(x - 0.7, y - 2.4, 1.4, 4.8);
    g.fillRect(x - 2.4, y - 0.7, 4.8, 1.4);
    g.fillRect(x - 1.1, y - 1.1, 2.2, 2.2);
    // the pulse, only while unvisited
    if (!seen) {
      var ph = (nowMs / 1400 + p.y * 0.01) % 1;
      g.strokeStyle = 'rgba(242,193,75,' + (0.5 * (1 - ph)).toFixed(2) + ')';
      g.lineWidth = 0.6;
      g.beginPath();
      g.arc(x, y, 3 + ph * 8, 0, Math.PI * 2);
      g.stroke();
    }
  });
}

/**
 * The MAKE CAMP target, visible but subtle (#17): a slow ring of orange dots
 * on the ground at each campsite, waking up when you are close enough.
 */
function drawCampRings(state, nowMs) {
  var g = R.g;
  CAMPSITES.forEach(function (c) {
    if (c.x < R.camX - 30 || c.x > R.camX + R.viewW + 30 ||
